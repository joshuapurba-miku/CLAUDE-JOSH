<title>Rekap Absensi Gaji</title>
<style>
/* Layout: bilah data di atas, enam tab. Dashboard = ringkasan dulu, lalu keputusan, lalu grafik, lalu tabel. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #17212b;
  --ink-2: #5a6775;
  --ink-3: #7d8a97;
  --line: #d5dce3;
  --accent: #0e7a4f;
  --accent-ink: #ffffff;
  --accent-soft: #dff1e8;
  --bar: #1f8a5c;
  --bar-track: #e3e8ed;
  --warn: #9a5b00;
  --warn-soft: #fbefd5;
  --warn-bar: #d48a12;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --info: #1f5f9e;
  --info-soft: #e0ecf8;
  --logo-bg: transparent;
  --logo-pad: 0;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf0; --ink-2: #9aa7b4; --ink-3: #7b8896;
    --line: #2e3a47; --accent: #4cc38a; --accent-ink: #0b1a13; --accent-soft: #17382a; --bar: #45b880; --bar-track: #26313c;
    --warn: #f0b95a; --warn-soft: #3a2c10; --warn-bar: #e0a03a; --bad: #ff8a80; --bad-soft: #3d1b19; --info: #8cc0f5; --info-soft: #172c42; --logo-bg: #f4f7f5; --logo-pad: 4px 6px; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf0; --ink-2: #9aa7b4; --ink-3: #7b8896;
  --line: #2e3a47; --accent: #4cc38a; --accent-ink: #0b1a13; --accent-soft: #17382a; --bar: #45b880; --bar-track: #26313c;
  --warn: #f0b95a; --warn-soft: #3a2c10; --warn-bar: #e0a03a; --bad: #ff8a80; --bad-soft: #3d1b19; --info: #8cc0f5; --info-soft: #172c42; --logo-bg: #f4f7f5; --logo-pad: 4px 6px; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; text-wrap: balance; }
h3 { font-size: 14px; margin: 0; }
p { margin: 0; }
.sub { color: var(--ink-2); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.saved { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.databar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.databar .meta { min-width: 0; }
.databar b { font-size: 15px; }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 0 6px; margin-left: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .cols2 { grid-template-columns: 1fr; } }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.step { display: flex; gap: 10px; align-items: flex-start; min-width: 0; text-align: left; }
.step .no { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.step.done .no { background: var(--accent); color: var(--accent-ink); }
.step b { display: block; }
/* angka utama */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.kpi .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
/* keputusan */
.insights { display: flex; flex-direction: column; }
.ins { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ins:first-child { border-top: 0; }
.ins .what { font-weight: 600; }
.ins .act { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
@media (max-width: 520px) { .ins { grid-template-columns: 1fr; gap: 4px; } }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
/* grafik batang horizontal */
.hbars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr minmax(64px, auto); gap: 10px; align-items: center; font-size: 12.5px; }
.hbar .nm { overflow-wrap: anywhere; color: var(--ink); }
.hbar .tr { height: 14px; background: var(--bar-track); border-radius: 0 4px 4px 0; position: relative; }
.hbar .fl { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.hbar .fl.warn { background: var(--warn-bar); }
.hbar .vl { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { fill: var(--ink-2); font-size: 11px; font-family: var(--font-body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart rect.col { fill: var(--bar); }
.chart rect.col.warn { fill: var(--warn-bar); }
.chart rect.hit { fill: transparent; cursor: default; }
.chart rect.hit:hover + rect.col, .chart g.c:hover rect.col { opacity: .75; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 260px; }
/* tabel */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr.emp { cursor: pointer; }
tr.emp:hover td { background: var(--surface-2); }
tr.tot td { font-weight: 700; background: var(--surface-2); }
td.wrap { white-space: normal; min-width: 220px; }
.neg { color: var(--bad); }
.detail td { background: var(--bg); }
.detail .scroll { margin: 4px 0; }
.banner { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 20px; text-align: center; color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.filters select, .filters input { width: auto; max-width: 240px; }
td input, td select { min-width: 90px; }
td input[type=number] { min-width: 110px; }
td input.wide { min-width: 210px; }
td input.wide.xl { min-width: 270px; }
textarea { resize: vertical; min-height: 70px; font-family: var(--font-num); font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
details > summary { cursor: pointer; font-weight: 600; }
/* rekap per lokasi: kalender kode absensi */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.cal { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.cal th, .cal td { border: 0; padding: 0; white-space: nowrap; }
.cal th { background: none; text-align: center; font-weight: 600; color: var(--ink-3); font-size: 11px; padding: 2px 0; }
.cal th.we { color: var(--warn); }
.cal td.nm { padding: 4px 10px 4px 0; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; }
.cal td.nm b { display: block; font-size: 12.5px; }
.cal td.sm { padding: 0 6px; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.cal th.sm { padding: 2px 6px; }
.cell { width: 26px; height: 26px; border: 0; border-radius: 4px; font: 600 11.5px var(--font-num); cursor: pointer; background: var(--surface-2); color: var(--ink-2); position: relative; padding: 0; }
.cell.H { background: var(--accent-soft); color: var(--accent); }
.cell.T { background: var(--warn-soft); color: var(--warn); }
.cell.A { background: var(--bad-soft); color: var(--bad); }
.cell.I, .cell.S, .cell.C { background: var(--info-soft); color: var(--info); }
.cell.O { background: transparent; color: var(--ink-3); }
.cell.adj::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.cell.rev { box-shadow: inset 0 0 0 2px var(--warn-bar); }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.keys .cell { cursor: default; width: 22px; height: 22px; margin-right: 4px; vertical-align: middle; }
/* tabel jam masuk & pulang */
.jt { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
.jt th, .jt td { border: 0; padding: 0; white-space: nowrap; }
.jt th { background: none; text-align: center; font-weight: 600; color: var(--ink-3); font-size: 10.5px; padding: 2px 0; }
.jt th.we { color: var(--warn); }
.jt td.nm { padding: 3px 10px 3px 0; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; font-size: 12px; }
.jt td.sm { padding: 0 6px; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12px; }
.jt th.sm { padding: 2px 6px; }
.tm { min-width: 42px; height: 24px; border: 0; border-radius: 4px; font: 500 11px var(--font-num); cursor: pointer; background: var(--surface-2); color: var(--ink); padding: 0 3px; position: relative; }
.tm.late { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.tm.early { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.tm.early::before { content: "▼"; font-size: 7px; position: absolute; top: 1px; left: 2px; }
.tm.ot { background: var(--accent-soft); color: var(--accent); }
.tm.miss { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.tm.abs { background: var(--bad-soft); color: var(--bad); }
.tm.lv { background: var(--info-soft); color: var(--info); }
.tm.off { background: transparent; color: var(--ink-3); cursor: default; }
.tm.adj::after { content: ""; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
/* merek & persetujuan */
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
#hdrLogo { height: 58px; width: auto; max-width: 180px; object-fit: contain; background: var(--logo-bg); border-radius: 8px; padding: var(--logo-pad); }
.logo-prev { height: 56px; max-width: 220px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
.slip .lg { background: #fff; border-radius: 6px; padding: 4px 6px; display: inline-flex; margin-right: 10px; flex: 0 0 auto; }
.slip .lg img { height: 48px; width: auto; max-width: 130px; object-fit: contain; }
.slip .band .left { display: flex; align-items: center; min-width: 0; }
.slip .band .no { font-weight: 400; letter-spacing: 0; opacity: .9; font-size: 11px; display: block; }
.slip .draft { display: inline-block; background: #fbefd5; color: #8a5200; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; letter-spacing: .1em; margin-top: 3px; }
.slip .conf { font-size: 10px; letter-spacing: .12em; color: var(--p-ink-2); text-transform: uppercase; }
/* modal koreksi */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .box { background: var(--surface); color: var(--ink); border-radius: 10px; width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 12px; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.facts div span { display: block; color: var(--ink-2); font-size: 11.5px; }
.facts div b { font-family: var(--font-num); font-weight: 600; }
/* input gaji */
.ig { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .ig { grid-template-columns: 1fr; } }
.ig .sumbox { position: sticky; top: 12px; }
.fs { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fs legend { font-weight: 700; font-size: 13.5px; padding: 0; margin-bottom: 8px; }
.fs .grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.sumline { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 13px; }
.sumline span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sumline.big { border-top: 2px solid var(--accent); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 15px; }
.sumline.big span:last-child { color: var(--accent); }
/* slip gaji: kertas putih di kedua tema, seperti dokumen cetak */
.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 18px; }
.slip { --p-ink: #1b2430; --p-ink-2: #5d6874; --p-line: #dde3e8; --p-head: #0e5c3d; --p-soft: #eef4f1; background: #ffffff; color: var(--p-ink); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; min-width: 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
.slip .band { background: var(--p-head); color: #ffffff; padding: 14px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.slip .band .co { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.slip .band .co small { display: block; font-weight: 400; opacity: .85; font-size: 11.5px; }
.slip .band .ttl { text-align: right; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.slip .band .ttl small { display: block; letter-spacing: 0; font-weight: 400; opacity: .9; }
.slip .body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.slip .id { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; margin: 0; }
.slip .id div { display: grid; grid-template-columns: 82px 1fr; gap: 6px; }
.slip .id dt { color: var(--p-ink-2); }
.slip .id dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.slip .att { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--p-line); border: 1px solid var(--p-line); border-radius: 6px; overflow: hidden; }
.slip .att div { background: var(--p-soft); padding: 6px 8px; min-width: 0; }
.slip .att b { display: block; font-family: var(--font-num); font-size: 15px; color: var(--p-ink); }
.slip .att span { color: var(--p-ink-2); font-size: 10.5px; }
.slip .att .bad b { color: #b3261e; }
.slip .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.slip h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--p-head); border-bottom: 1px solid var(--p-head); padding-bottom: 3px; }
.slip .sec { margin-top: 8px; font-weight: 700; font-size: 11.5px; color: var(--p-ink-2); }
.slip .sec small { font-weight: 400; }
.slip .ln { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.slip .ln span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.slip .ln.sub { border-top: 1px dashed var(--p-line); font-weight: 600; }
.slip .ln.tot { border-top: 1px solid var(--p-ink); margin-top: 6px; padding-top: 4px; font-weight: 700; }
.slip .muted { color: var(--p-ink-2); font-size: 11.5px; }
.slip .net { background: var(--p-soft); border-radius: 6px; padding: 10px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.slip .net div span { display: block; color: var(--p-ink-2); font-size: 11px; }
.slip .net div b { font-family: var(--font-num); font-size: 14px; }
.slip .net .thp b { color: var(--p-head); font-size: 18px; }
.slip .terb { font-style: italic; color: var(--p-ink-2); }
.slip .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; text-align: center; margin-top: 4px; }
.slip .sign .sp { height: 46px; }
.slip .sign .sp { height: 78px; }
.slip .sign .sp.ttd { display: flex; align-items: center; justify-content: center; }
.slip .sign .sp.ttd img { height: 76px; width: auto; max-width: 220px; }
.slip .vcode { font-size: 10px; color: var(--p-ink-2); font-family: var(--font-num); margin-top: 3px; }
.slip .flag { background: #fbefd5; color: #8a5200; border-radius: 4px; padding: 6px 8px; font-weight: 600; }
.slip .acts { display: flex; justify-content: flex-end; gap: 8px; }
.slip .acts .btn.ghost { color: var(--p-ink); border-color: var(--p-line); background: #fff; }
@media (max-width: 560px) { .slip .cols, .slip .id { grid-template-columns: 1fr; } .slip .att { grid-template-columns: repeat(3, minmax(0, 1fr)); } .slip .net { grid-template-columns: 1fr; } }
@media (max-width: 520px) { h1 { font-size: 19px; } .kpi .v { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function parseTgl(v) {
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    const p = String(v).trim().split(/\s+/);
    const m = BULAN[(p[1] || "").slice(0, 3).toLowerCase()];
    if (p.length < 3 || !m) return null;
    return p[2] + "-" + String(m).padStart(2, "0") + "-" + String(p[0]).padStart(2, "0");

      const telat = hadir.filter((d) => d["Telat (mnt)"] > 0), pc = hadir.filter((d) => d["Pulang Cepat (mnt)"] > 0);

      const r = {

        Hadir: hadir.length, Absen: st("Absent").length, Izin: st("Izin").length, Sakit: st("Sakit").length, Cuti: st("Cuti").length, Off: st("Off").length,
        TidakCI: gr.filter((d) => d.rawStatus === "Absent").length, TidakCO: hadir.filter((d) => d.tidakCO).length,
        TelatKali: telat.length, TelatMnt: sum(telat, "Telat (mnt)"), TelatKenaKali: hadir.filter((d) => d["Potongan Telat (Rp)"] > 0).length, TelatPot: sum(hadir, "Potongan Telat (Rp)"),

        Double: hadir.filter((d) => d["Double Shift"] === "ya").length,
        ShiftBerubah: hadir.filter((d) => d["Status Shift"].startsWith("shift berubah")).length,
        TelatHris: sum(hadir, "Telat Kolabo (mnt)"), Dikoreksi: gr.filter((d) => d.adj).length
      };
      r.Terjadwal = r.Hadir + r.Absen + r.Izin + r.Sakit + r.Cuti;
      const s = hitungGaji(r, periode);
      r.slip = s;
      r.adaTarif = s.ada; r.gaji = s.g.gaji; r.Pendapatan = s.bruto; r.Potongan = s.potongan;
      r.PotAbsen = s.ada ? s.harian * (r.Absen + r.Izin) : 0;
      r.GajiBersih = s.ada ? Math.max(0, s.thp) : null; r.Minus = s.ada && s.thp < 0;
      r.Mengganti = r.Double + (+s.M.mengganti || 0);

      r.Biaya = s.bruto + s.benefit; r.Benefit = s.benefit; r.TanpaJadwal = s.tanpaJadwal; r.Order = s.orders.length; r.OrderJam = s.hc.jam;
      rekap.push(r);
    });

    [...rekap].sort((a, b) => a.Cabang.localeCompare(b.Cabang) || a.Nama.localeCompare(b.Nama)).forEach((r, i) => { r.NoSlip = `SG/${periode.slice(0, 4)}/${periode.slice(5, 7)}/${String(i + 1).padStart(3, "0")}`; });

    rekap.forEach((r) => { if (r.Hadir === 0 && r.Absen > 0) review.push({ key: r.key, Tanggal: "", Nama: r.Nama, NIP: r.NIP, Cabang: r.Cabang, "Jadwal Kolabo": "", "Check In": "", "Check Out": "", Alasan: "Tidak pernah hadir sebulan penuh (" + r.Absen + " hari tanpa keterangan): resign, belum pakai aplikasi, atau cuti?" }); });
    const nipNama = new Map();
    rows.forEach((r) => { if (!nipNama.has(r.nip)) nipNama.set(r.nip, new Set()); nipNama.get(r.nip).add(r.nama); });
    nipNama.forEach((v, nip) => {

    });
    return { det, rekap, review, periode, tanggal: tglList, dari: tglList[0], sampai: tglList[tglList.length - 1] };
  }

  function terbilang(n) {
    const s = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
    const f = (x) => x < 12 ? s[x] : x < 20 ? f(x - 10) + " belas" : x < 100 ? f(Math.floor(x / 10)) + " puluh " + f(x % 10)
      : x < 200 ? "seratus " + f(x - 100) : x < 1000 ? f(Math.floor(x / 100)) + " ratus " + f(x % 100)
      : x < 2000 ? "seribu " + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + " ribu " + f(x % 1000)
      : x < 1e9 ? f(Math.floor(x / 1e6)) + " juta " + f(x % 1e6) : f(Math.floor(x / 1e9)) + " miliar " + f(x % 1e9);
    const t = f(Math.floor(Math.abs(n))).replace(/\s+/g, " ").trim();
    return t ? t[0].toUpperCase() + t.slice(1) + " rupiah" : "Nol rupiah";
  }

  // ---------- rekap jam masuk & pulang (kalender sebulan) ----------
  let jamCabang = "";
  function hariBulan() {

    if (d.Status !== "Present") return `<button class="tm lv${adj}" ${base}>${d.Kode}</button>`;
    if (jenis === "in") {
      const t = (d["Check In"] || "").slice(0, 5) || "—";
      return `<button class="tm${d["Telat (mnt)"] > 0 ? " late" : ""}${adj}" ${base} aria-label="${esc(d.Nama)} masuk ${t}${d["Telat (mnt)"] ? ", telat " + d["Telat (mnt)"] + " menit" : ""}">${t}</button>`;

  function rekapJamHTML() {
    const cabs = [...new Set(hasil.rekap.map((r) => r.Cabang))].sort();
    if (jamCabang && !cabs.includes(jamCabang)) jamCabang = "";
    const rk = hasil.rekap.filter((r) => !jamCabang || r.Cabang === jamCabang).sort((a, b) => a.Cabang.localeCompare(b.Cabang) || a.Nama.localeCompare(b.Nama));

  // ---------- modal koreksi ----------
  function tutupModal() { $("#modal").innerHTML = ""; document.removeEventListener("keydown", escModal); }
  function escModal(e) { if (e.key === "Escape") tutupModal(); }
  function bukaKoreksi(key, tgl) {
    if (dikunci()) { setSaved(reviewMode ? "Mode tinjauan approver: data hanya bisa dilihat." : "Periode sudah disetujui dan dikunci. Buka kunci di tab Slip Gaji untuk mengoreksi."); return; }
    const d = hasil.det.find((x) => x.key === key && x.Tanggal === tgl);
    if (!d) return;
    const a = d.adj || {}, au = d.auto;
    const tarifL = d.lemburTarif != null ? d.lemburTarif : cfg.tarifLembur;
    const opt = (v, l) => `<option value="${v}"${(a.status || "") === v ? " selected" : ""}>${l}</option>`;
    $("#modal").innerHTML = `<div class="modal" id="mbg"><form class="box" id="mform" aria-labelledby="mtitle">
      <div><h2 id="mtitle">Koreksi absensi</h2><p class="sub">${esc(d.Nama)} · ${esc(d.Cabang)} · ${d.Hari} ${tglPendek(d.Tanggal)} ${hasil.periode.slice(0, 4)}</p></div>
      <div class="facts"><div><span>Status Kolabo</span><b>${d.rawStatus === "Present" ? "Hadir" : d.rawStatus === "Absent" ? "Tidak check-in" : "Off"}</b></div><div><span>Jadwal Kolabo</span><b>${esc(d["Jadwal Kolabo"] || "—")}</b></div>
        <div><span>Shift aktual</span><b>${esc(d["Shift Aktual"] || "—")}</b></div><div><span>Masuk</span><b>${esc(d["Check In"] || "—")}</b></div><div><span>Pulang</span><b>${esc(d["Check Out"] || "—")}</b></div>

      ${d.Catatan.length || d._review.length ? `<p class="hint">${esc(d.Catatan.filter((c) => !c.startsWith("dikoreksi")).concat(d._review).join("; "))}</p>` : ""}
      <div class="field"><label for="m-status">Status hari ini</label><select id="m-status">${opt("", "Otomatis (sistem: " + STATUS_LABEL[au.status] + ")")}${opt("hadir", "Hadir")}${opt("absen", "Tanpa keterangan (dipotong)")}${opt("izin", "Izin (dipotong)")}${opt("sakit", "Sakit (dibayar)")}${opt("cuti", "Cuti (dibayar)")}${opt("off", "Off / libur")}</select></div>
      <div class="grid"><div class="field"><label for="m-telat">Menit telat yang dihitung</label><input type="number" id="m-telat" min="0" inputmode="numeric" value="${isNum(a.telat) ? a.telat : ""}" placeholder="otomatis: ${au.telat}"><span class="hint">Isi 0 untuk memaafkan telat. Telat &gt; ${cfg.telatAmbang} mnt dipotong ${rp(cfg.telatNominal)}.</span></div>
        <div class="field"><label for="m-lembur">Jam lembur dibayar</label><input type="number" id="m-lembur" min="0" step="0.5" value="${isNum(a.lembur) ? a.lembur : ""}" placeholder="otomatis: ${au.lembur}"><span class="hint">Tarif ${rp(tarifL)}/jam${d.lemburTarif != null ? " (aturan lembur lokasi)" : " (tarif lembur bawaan)"}.</span></div></div>
      ${d.tidakCO || a.co ? `<label class="row"><input type="checkbox" id="m-co"${a.co === "ok" ? " checked" : ""}> Check-out sudah dikonfirmasi (tidak dihitung "tidak check-out")</label>` : ""}
      <div class="field"><label for="m-ket">Alasan koreksi</label><input type="text" id="m-ket" value="${esc(a.ket || "")}" placeholder="misal: tukar shift disetujui PIC"></div>
      <div class="row between"><div>${d.adj ? '<button type="button" class="btn ghost" id="m-reset">Kembalikan ke otomatis</button>' : ""}</div>

    </form></div>`;
    document.addEventListener("keydown", escModal); $("#tip").hidden = true;

    const k = key + "|" + tgl;
    if ($("#m-reset")) $("#m-reset").onclick = () => { delete cfg.adj[k]; tutupModal(); scheduleSave(); recompute(); };
    $("#mform").onsubmit = (e) => {
      e.preventDefault();
      const n = {};
      const s = $("#m-status").value, t = $("#m-telat").value, l = $("#m-lembur").value, ket = $("#m-ket").value.trim();

      tutupModal(); scheduleSave(); recompute();
    };
    $("#m-status").focus();

  let inputKey = "";

    const [id, label, type, list] = f;

    return `<div class="field"><label for="in-${scope}-${id}">${label}</label><input type="${t}" id="in-${scope}-${id}" data-scope="${scope}" data-f="${id}" ${list ? `list="${list}"` : ""} ${t === "number" ? 'min="0" step="1000" inputmode="numeric"' : ""} value="${esc(val == null ? "" : val)}"></div>`;
  }
  function renderInput() {

    if (!rk.some((r) => r.key === inputKey)) inputKey = rk[0].key;

      <button class="btn" id="mb-go">Terapkan</button></div><p class="hint" id="mb-msg" style="margin-top:6px">Mengganti nilai komponen itu untuk bulan ${bulanLabel(hasil.periode)}. Isi 0 untuk menghapus.</p></details>`;
    h += dl("dl-jab", ["CSO - JUNIOR", "CSO - SENIOR", "PIC - PERCOBAAN", "PIC - JUNIOR", "PIC - SENIOR", "INTERNAL", "MANPOWER"]) + dl("dl-status", ["MITRA KERJA", "PROBATION", "KONTRAK", "PERMANEN"]) + dl("dl-bank", ["BRI", "BNI", "Mandiri", "BCA", "BSI", "BTN", "Bank Sulselbar"]);
    h += `<div class="ig"><div class="stack">
      <div class="panel"><fieldset class="fs"><legend>Data tetap ${esc(r.Nama)} <span class="sub">(berlaku untuk bulan-bulan berikutnya)</span></legend>
        <p class="hint">Tarif ${esc(r.Cabang)} / ${esc(r.Posisi)}: gaji pokok ${rp(t.gaji)}, tunj. makan & transport ${rp(t.tunjMT)}, kinerja ${rp(t.tunjKin)}, absensi ${rp(t.tunjAbs)}. Isi kolom "khusus" hanya jika pegawai ini berbeda dari tarif (misal PIC senior).</p>
        <div class="grid">${F_TETAP.map((f) => fieldHTML("tetap", r.key, f, P[f[0]])).join("")}</div></fieldset></div>`;

      h += `<div class="panel"><fieldset class="fs"><legend>${s.sec} <span class="sub">· ${bulanLabel(hasil.periode)}</span></legend>${s.hint ? `<p class="hint">${s.hint}</p>` : ""}<div class="grid">${s.f.map((f) => fieldHTML("bulan", r.key, f, M[f[0]])).join("")}</div></fieldset></div>`;

  // ---------- PDF slip (A4) ----------
  function gambarSlip(doc, r) {
    const G = [14, 92, 61], INK = [27, 36, 48], MUTED = [93, 104, 116], SOFT = [238, 244, 241], LINE = [221, 227, 232], RED = [179, 38, 30];
    const s = r.slip, d = slipData(r), thp = Math.max(0, s.thp);

    doc.text("No. " + r.NoSlip, X1, 23, { align: "right" });
    doc.setFontSize(7.5); doc.text(terkunci() ? "RAHASIA" : "DRAFT · RAHASIA", X1, 27.5, { align: "right" });
    let y = 40;
    // identitas
    const idf = [["Nama", r.Nama, "NIP", r.NIP || "-"], ["Jabatan", r.Jabatan, "Penempatan", r.Cabang], ["Status", r.StatusKerja || "-", "Performance", s.M.performance || "-"]];
    doc.setFontSize(9.5);
    idf.forEach((p) => {
      doc.setTextColor(...MUTED); doc.text(p[0], X0, y); doc.text(p[2], 107, y);
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold");
      doc.text(doc.splitTextToSize(String(p[1]), 62)[0], X0 + 24, y); doc.text(doc.splitTextToSize(String(p[3]), 62)[0], 107 + 24, y);
      doc.setFont("helvetica", "normal"); y += 6;
    });
    // kehadiran
    y += 1;
    const att = attItems(r), cw = W / 5;
    att.forEach((a, i) => {
      const cx = X0 + (i % 5) * cw, cy = y + Math.floor(i / 5) * 13;
      doc.setFillColor(...SOFT); doc.rect(cx + 0.4, cy, cw - 0.8, 12, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...(a[2] ? RED : INK)); doc.text(String(a[1]), cx + 3, cy + 5.5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.text(a[0], cx + 3, cy + 10);
    });
    y += 33;
    // dua kolom
    const CW = 86, XL = X0, XR = X0 + W - CW;
    const head = (t, x, yy) => { doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...G); doc.text(t.toUpperCase(), x, yy); doc.setDrawColor(...G); doc.setLineWidth(0.4); doc.line(x, yy + 1.5, x + CW, yy + 1.5); return yy + 7; };
    const line = (a, x, yy, bold) => {
      doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(9); doc.setTextColor(...INK);
      doc.text(doc.splitTextToSize(a[0], CW - 28)[0], x, yy); doc.text(rpT(a[1]), x + CW, yy, { align: "right" }); return yy + 5;
    };
    const total = (a, x, yy) => { doc.setDrawColor(...INK); doc.setLineWidth(0.3); doc.line(x, yy - 3.4, x + CW, yy - 3.4); return line(a, x, yy + 0.6, true) + 1; };
    let yl = head("Pendapatan", XL, y);
    d.pend.forEach((sec) => {
      doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
      doc.text(sec.sec + (sec.info ? "  (" + sec.info + ")" : ""), XL, yl); yl += 4.6;
      sec.items.forEach((it) => { yl = line(it, XL + 2, yl); });
      if (sec.items.length > 1) { doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(XL + 2, yl - 3.4, XL + CW, yl - 3.4); doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text("Subtotal", XL + 2, yl); doc.text(rpT(sec.total), XL + CW, yl, { align: "right" }); yl += 5; }
      yl += 1.5;

    yl = total(["Total pendapatan bruto", s.bruto], XL, yl + 1);
    let yr = head("Potongan", XR, y);
    (d.pot.length ? d.pot : [["Tidak ada potongan", 0]]).forEach((x) => { yr = line(x, XR, yr); });
    yr = total(["Total potongan", s.potongan], XR, yr + 1);
    if (d.ben.length) {
      yr = head("Benefit dari perusahaan", XR, yr + 5);
      d.ben.forEach((x) => { yr = line(x, XR, yr); });
      yr = total(["Total benefit", s.benefit], XR, yr + 1);
      doc.setFont("helvetica", "italic"); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
      doc.text("Dibayarkan perusahaan ke BPJS/penyedia, tidak diterima tunai.", XR, yr); yr += 4;
    }
    y = Math.max(yl, yr) + 5;
    // ringkasan
    doc.setFillColor(...SOFT); doc.rect(X0, y, W, 20, "F");
    const sx = [X0 + 4, X0 + 64, X0 + 120];
    [["Total pendapatan", rpT(s.bruto)], ["Total potongan", "-" + rpT(s.potongan)], ["Gaji diterima (take home pay)", rpT(thp)]].forEach((a, i) => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(a[0], sx[i], y + 7);
      doc.setFont("helvetica", "bold"); doc.setFontSize(i === 2 ? 15 : 11); doc.setTextColor(...(i === 2 ? G : INK)); doc.text(a[1], sx[i], y + 15);
    });
    y += 26;
    doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(...MUTED);
    const tb = doc.splitTextToSize("Terbilang: " + terbilang(thp), W); doc.text(tb, X0, y); y += tb.length * 4.5 + 2;
    if (s.M.catatan) { doc.setFont("helvetica", "normal"); doc.setTextColor(...INK); const c = doc.splitTextToSize("Catatan: " + s.M.catatan, W); doc.text(c, X0, y); y += c.length * 4.5 + 2; }
    // tanda tangan
    y = Math.max(y + 6, 240);
    if (y > 244) { doc.addPage(); y = 30; }
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...INK);

  }

  // ---------- util PDF bersama ----------
  function logoPDF(doc, x, y, h) {
    if (!logoSrc() || !cfg.logoW) return 0;
    const ih = h - 3, w = Math.min(45, ih * cfg.logoW / cfg.logoH), ihh = w * cfg.logoH / cfg.logoW;
    doc.setFillColor(255, 255, 255); doc.roundedRect(x, y, w + 4, h, 2, 2, "F");
    try { doc.addImage(logoSrc(), "PNG", x + 2, y + (h - ihh) / 2, w, ihh); } catch (e) { return 0; }
    return w + 8;
  }
  function watermark(doc, teks) {
    doc.saveGraphicsState();
    try { doc.setGState(new doc.GState({ opacity: 0.07 })); } catch (e) { /* abaikan */ }
    doc.setTextColor(120, 120, 120); doc.setFont("helvetica", "bold"); doc.setFontSize(110);
    doc.text(teks, 45, 215, { angle: 35 });
    doc.restoreGraphicsState();
  }
  function namaPDF(doc, x, y, maxW) {
    doc.setFontSize(14);
    if (doc.getTextWidth(namaPT()) <= maxW) { doc.text(namaPT(), x, y); return; }
    doc.setFontSize(11);
    const ln = doc.splitTextToSize(namaPT(), maxW).slice(0, 2);
    doc.text(ln, x, ln.length > 1 ? y - 3.6 : y);
  }

  // ---------- agregasi ----------
  function perCabang() {
    const m = new Map(), inv = cfg.invoice[hasil.periode] || {};
    hasil.rekap.forEach((r) => {
      if (!m.has(r.Cabang)) m.set(r.Cabang, { cabang: r.Cabang, n: 0, hadir: 0, terjadwal: 0, absen: 0, telat: 0, telatPot: 0, lembur: 0, lemburTak: 0, gaji: 0, biaya: 0, tarifKurang: 0, berubah: 0, tanpaJadwal: r.TanpaJadwal, order: 0, orderJam: 0 });
      const c = m.get(r.Cabang);
      c.n++; c.hadir += r.Hadir; c.terjadwal += r.Terjadwal; c.absen += r.Absen; c.telat += r.TelatKali; c.telatPot += r.TelatPot;
      c.lembur += r.LemburUpah; c.lemburTak += r.LemburTakDibayarJam; c.gaji += r.GajiBersih || 0; c.biaya += r.adaTarif ? r.Biaya : 0; c.berubah += r.ShiftBerubah;
      c.order += r.Order; c.orderJam += r.OrderJam;
      if (!r.adaTarif && r.Hadir > 0) c.tarifKurang++;
    });
    return [...m.values()].map((c) => Object.assign(c, { persen: c.terjadwal ? c.hadir / c.terjadwal : (c.tanpaJadwal ? 1 : 0), invoice: +inv[c.cabang] || 0 }));
  }
  function perHari() {
    const m = new Map();
    hasil.det.forEach((d) => {
      if (d.tanpaJadwal) return;
      if (!m.has(d.Tanggal)) m.set(d.Tanggal, { tgl: d.Tanggal, hari: d.Hari, hadir: 0, terjadwal: 0 });
      const x = m.get(d.Tanggal);
      if (d.Status === "Present") { x.hadir++; x.terjadwal++; } else if (d.Status !== "Off") x.terjadwal++;
    });
    return [...m.values()].sort((a, b) => a.tgl.localeCompare(b.tgl)).map((x) => Object.assign(x, { persen: x.terjadwal ? x.hadir / x.terjadwal : 0 }));
  }
  function simpanRiwayat() {
    if (!hasil) return;
    const cab = perCabang(), rk = hasil.rekap;
    const snap = { biaya: Math.round(sumBy(cab, (c) => c.biaya)), thp: Math.round(sumBy(rk, (r) => r.GajiBersih || 0)), invoice: Math.round(sumBy(cab, (c) => c.invoice)),
      pegawai: rk.length, hadir: sumBy(rk, (r) => r.Hadir), terjadwal: sumBy(rk, (r) => r.Terjadwal), telatPot: sumBy(rk, (r) => r.TelatPot),
      cab: Object.fromEntries(cab.map((c) => [c.cabang, { biaya: Math.round(c.biaya), invoice: c.invoice }])) };
    if (JSON.stringify(cfg.riwayat[hasil.periode]) !== JSON.stringify(snap)) { cfg.riwayat[hasil.periode] = snap; scheduleSave(); }
  }

  function insights(cab) {
    const out = [], rk = hasil.rekap;
    const rugi = cab.filter((c) => c.invoice && c.biaya > c.invoice).sort((a, b) => (a.invoice - a.biaya) - (b.invoice - b.biaya));
    if (rugi.length) out.push({ sev: "bad", what: `Biaya gaji melebihi invoice di ${rugi.length} lokasi`,
      act: rugi.map((c) => `${c.cabang}: biaya ${rp(c.biaya)}, invoice ${rp(c.invoice)}, rugi ${rp(c.biaya - c.invoice)}`).join("; ") + ". Cek kembali nilai kontrak, jumlah personel, dan lembur di lokasi ini." });
    const tipis = cab.filter((c) => c.invoice && c.biaya <= c.invoice && (c.invoice - c.biaya) / c.invoice < 0.1);
    if (tipis.length) out.push({ sev: "warn", what: `Margin di bawah 10% di ${tipis.length} lokasi`, act: tipis.map((c) => `${c.cabang} (${pct((c.invoice - c.biaya) / c.invoice)})`).join("; ") + "." });
    const tanpaInv = cab.filter((c) => !c.invoice && c.biaya);
    if (tanpaInv.length) out.push({ sev: "info", what: `${tanpaInv.length} lokasi belum diisi nilai invoice-nya`, act: "Isi di tabel Biaya vs invoice agar untung/rugi per lokasi terlihat: " + tanpaInv.map((c) => c.cabang).join(", ") + "." });
    const nol = rk.filter((r) => r.Hadir === 0 && r.Absen > 0);
    if (nol.length) {
      const g = sumBy(nol, (r) => r.gaji);
      out.push({ sev: "bad", what: `${nol.length} pegawai tidak pernah hadir sebulan penuh`,
        act: `${nol.map((r) => r.Nama).join(", ")}. Pastikan statusnya (resign, belum pakai Kolabo, atau cuti). Jika sudah tidak aktif, nonaktifkan di Kolabo.` + (g ? ` Gaji pokok yang masih tercatat ${rp(g)} per bulan.` : "") });
    }
    const rendah = cab.filter((c) => !c.tanpaJadwal && c.terjadwal && c.persen < AMBANG_HADIR).sort((a, b) => a.persen - b.persen);
    if (rendah.length) out.push({ sev: rendah[0].persen < 0.7 ? "bad" : "warn", what: `Kehadiran di bawah ${Math.round(AMBANG_HADIR * 100)}% di ${rendah.length} lokasi`,
      act: rendah.map((c) => `${c.cabang} (${pct(c.persen)}, ${c.absen} hari tanpa keterangan)`).join("; ") + ". Cek kecukupan personel dan apakah jadwal di Kolabo sesuai kenyataan." });
    const kena = rk.filter((r) => r.TelatKenaKali > 0).sort((a, b) => b.TelatKenaKali - a.TelatKenaKali || b.TelatMnt - a.TelatMnt);
    if (kena.length) out.push({ sev: "warn", what: `Telat lebih dari ${cfg.telatAmbang} menit terjadi ${sumBy(kena, (r) => r.TelatKenaKali)} kali, potongan ${rp(sumBy(kena, (r) => r.TelatPot))}`,
      act: "Paling sering: " + kena.slice(0, 3).map((r) => `${r.Nama} (${r.TelatKenaKali}×, ${r.TelatMnt} mnt)`).join(", ") + ". Jika ada yang telat karena tukar shift resmi, koreksi di Rekap Absensi." });
    const hadir = sumBy(rk, (r) => r.Hadir), berubah = sumBy(rk, (r) => r.ShiftBerubah);
    if (hadir && berubah / hadir > 0.1) {
      const top = [...cab].sort((a, b) => b.berubah - a.berubah).slice(0, 3).filter((c) => c.berubah);
      out.push({ sev: "warn", what: `${pct(berubah / hadir)} hari kerja dijalankan di shift yang berbeda dari jadwal Kolabo`,
        act: "Paling banyak di " + top.map((c) => `${c.cabang} (${c.berubah} hari)`).join(", ") + ". Perbarui jadwal di Kolabo. Sistem ini sudah menyesuaikan telat otomatis." });
    }
    const tak = sumBy(rk, (r) => r.LemburTakDibayarJam);
    if (tak >= 1) {
      const top = [...cab].sort((a, b) => b.lemburTak - a.lemburTak).slice(0, 3).filter((c) => c.lemburTak >= 0.5);
      out.push({ sev: "info", what: `${jam(tak)} lewat jam pulang belum dibayar sebagai lembur`,
        act: "Terbanyak di " + top.map((c) => `${c.cabang} (${jam(c.lemburTak)})`).join(", ") + ". Jika lembur disetujui, tambahkan aturan lembur di Aturan atau koreksi per hari di Rekap Absensi." });
    }
    const hc = cab.filter((c) => c.tanpaJadwal);
    hc.forEach((c) => out.push({ sev: "info", what: `${c.cabang}: ${c.order} order, ${c.orderJam} jam kerja`, act: `Dihitung dari check-in Kolabo (tanpa jadwal tetap), dibayar sesuai tabel tarif home cleaning. Biaya ${rp(c.biaya)}.` }));
    const tk = rk.filter((r) => !r.adaTarif && r.Hadir > 0);
    if (tk.length) out.push({ sev: "warn", what: `${tk.length} pegawai belum punya gaji pokok, slip dan total biaya belum lengkap`,
      act: "Isi di Tarif Gaji: " + [...new Set(tk.map((r) => r.Cabang + " / " + r.Posisi))].join("; ") + "." });
    const dq = hasil.review.filter((v) => v.Alasan.startsWith("NIP"));
    if (dq.length) out.push({ sev: "info", what: `${dq.length} masalah data NIP di Kolabo`, act: dq.map((v) => `${v.Nama}: ${v.Alasan}`).join("; ") + "." });
    if (!out.length) out.push({ sev: "ok", what: "Tidak ada masalah besar bulan ini", act: "Kehadiran, keterlambatan, biaya, dan lembur dalam batas wajar." });
    const order = { bad: 0, warn: 1, info: 2, ok: 3 };
    return out.sort((a, b) => order[a.sev] - order[b.sev]);
  }

  // ---------- grafik ----------
  function hbars(items, fmt, opts) {
    const max = Math.max(...items.map((x) => x.v), opts && opts.max || 0) || 1;
    return '<div class="hbars">' + items.map((x) =>
      `<div class="hbar" data-tip="${esc(x.tip || "")}"><div class="nm">${esc(x.label)}</div><div class="tr"><div class="fl ${x.warn ? "warn" : ""}" style="width:${Math.max(0.5, x.v / max * 100)}%"></div></div><div class="vl">${fmt(x.v)}</div></div>`).join("") + "</div>";
  }
  function pairBars(cab) {
    const max = Math.max(...cab.map((c) => Math.max(c.biaya, c.invoice))) || 1;
    return '<div class="hbars">' + cab.map((c) => {
      const tip = `${c.cabang}: biaya ${rp(c.biaya)}` + (c.invoice ? `, invoice ${rp(c.invoice)}, ${c.invoice >= c.biaya ? "margin" : "rugi"} ${rp(Math.abs(c.invoice - c.biaya))}` : ", invoice belum diisi");
      return `<div class="hbar" data-tip="${esc(tip)}"><div class="nm">${esc(c.cabang)}</div><div style="display:flex;flex-direction:column;gap:3px"><div class="tr" style="height:10px"><div class="fl ${c.invoice && c.biaya > c.invoice ? "warn" : ""}" style="width:${Math.max(0.5, c.biaya / max * 100)}%"></div></div><div class="tr" style="height:10px"><div class="fl" style="background:var(--info);width:${c.invoice ? Math.max(0.5, c.invoice / max * 100) : 0}%"></div></div></div><div class="vl">${c.invoice ? (c.invoice >= c.biaya ? "+" : "−") + pct(Math.abs(c.invoice - c.biaya) / c.invoice) : "—"}</div></div>`;
    }).join("") + `</div><div class="legend"><span><i style="background:var(--bar)"></i>Biaya tenaga kerja</span><span><i style="background:var(--warn-bar)"></i>Biaya melebihi invoice</span><span><i style="background:var(--info)"></i>Invoice</span><span>Angka kanan: margin terhadap invoice</span></div>`;
  }
  function kolomHarian(hr) {
    const W = 760, H = 210, L = 38, R = 8, T = 10, B = 26, n = hr.length;
    const cw = (W - L - R) / n, bw = Math.max(3, cw - 3);
    const y = (p) => T + (1 - p) * (H - T - B);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Persentase kehadiran per hari"><g class="grid">`;
    [0, 0.25, 0.5, 0.75, 1].forEach((p) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}"></line><text x="${L - 6}" y="${y(p) + 4}" text-anchor="end">${p * 100}%</text>`; });
    s += "</g>";
    hr.forEach((d, i) => {
      const x = L + i * cw + (cw - bw) / 2, top = y(d.persen), hgt = Math.max(0, y(0) - top);
      const tip = `${d.hari} ${tglPendek(d.tgl)}: ${d.hadir} hadir dari ${d.terjadwal} terjadwal (${pct(d.persen)})`;
      s += `<g class="c" data-tip="${esc(tip)}"><rect class="hit" x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}"></rect><rect class="col ${d.persen < AMBANG_HADIR ? "warn" : ""}" x="${x}" y="${top}" width="${bw}" height="${hgt}" rx="${Math.min(3, bw / 2)}"></rect></g>`;
      if (i === 0 || (+d.tgl.slice(8)) % 5 === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${+d.tgl.slice(8)}</text>`;
    });
    return s + "</svg>";
  }
  const legenda = () => `<div class="legend"><span><i style="background:var(--bar)"></i>${Math.round(AMBANG_HADIR * 100)}% atau lebih</span><span><i style="background:var(--warn-bar)"></i>di bawah ${Math.round(AMBANG_HADIR * 100)}% (perlu perhatian)</span></div>`;

  // ---------- tab Dashboard ----------
  function renderDash() {
    const el = $("#tab-dash");
    if (!hasil) { el.innerHTML = uploadPanel(); bindUpload(el); return; }
    const rk = hasil.rekap, cab = perCabang(), hr = perHari();

    const biaya = sumBy(cab, (c) => c.biaya), thp = sumBy(rk, (r) => r.GajiBersih || 0), inv = sumBy(cab, (c) => c.invoice);
    const invCab = cab.filter((c) => c.invoice), biayaInv = sumBy(invCab, (c) => c.biaya), margin = inv - biayaInv;
    const sev = { bad: ["bad", "Kritis"], warn: ["warn", "Perhatian"], info: ["", "Info"], ok: ["ok", "Baik"] };
    const per = Object.keys(cfg.riwayat).sort(), prevP = per.filter((p) => p < hasil.periode).pop(), prev = prevP ? cfg.riwayat[prevP] : null;
    const delta = (now, old) => old ? `${now >= old ? "naik" : "turun"} ${pct(Math.abs(now - old) / (old || 1))} dari ${bulanLabel(prevP)}` : "";
    // progres kerja bulanan
    const tarifKurang = rk.filter((r) => !r.adaTarif && r.Hadir > 0).length, bul = cfg.bulanan[hasil.periode] || {};
    const steps = [
      [true, "Data Kolabo diupload", `${rk.length} pegawai, ${hasil.det.length} baris absensi`, ""],
      [!hasil.review.length, "Absensi dicek", hasil.review.length ? `${hasil.review.length} kasus perlu dicek` : "semua kasus sudah dicek", "rekap"],
      [!tarifKurang, "Tarif gaji lengkap", tarifKurang ? `${tarifKurang} pegawai belum ada gaji pokok` : "semua pegawai punya tarif", "gaji"],
      [Object.keys(bul).length > 0, "Komponen variabel diisi", `${Object.keys(bul).length} pegawai punya input bulan ini (bonus, HC, kasbon)`, "input"],
      [invCab.length === cab.length, "Invoice per lokasi diisi", `${invCab.length} dari ${cab.length} lokasi`, "#inv"],
      [rk.filter((r) => r.adaTarif && r.Pendapatan > 0).length > 0, "Slip siap diunduh", `${rk.filter((r) => r.adaTarif && r.Pendapatan > 0).length} slip siap`, "slip"],
      [terkunci(), "Disetujui & dikunci", terkunci() ? `oleh ${cfg.approval[hasil.periode].oleh}${cfg.approval[hasil.periode].digital ? " (tanda tangan digital)" : ""}` : cfg.penolakan[hasil.periode] ? "ditolak, perlu diperbaiki" : (cfg.approvers || []).length ? "menunggu approver" : "masih draft", "slip"]
    ];
    let h = `<div class="stack"><div class="panel"><div class="row between"><h2>Progres rekap gaji ${bulanLabel(hasil.periode)}</h2>
      <div class="row"><span class="hint">Unduh isi dashboard:</span><button class="btn ghost small" id="lap-xls">Laporan Excel</button><button class="btn small" id="lap-pdf">Laporan PDF untuk manajemen</button></div></div><div class="steps" style="margin-top:12px">${steps.map((s, i) => `<div class="step ${s[0] ? "done" : ""}"><div class="no">${s[0] ? "✓" : i + 1}</div><div><b>${s[1]}</b><span class="sub">${s[2]}${s[3] ? ` · ${s[3].startsWith("#") ? `<a href="${s[3]}">isi</a>` : `<a href="#" data-go="${s[3]}">buka</a>`}` : ""}</span></div></div>`).join("")}</div></div>`;
    h += `<h2>Penggajian</h2><div class="kpis">
      <div class="kpi"><div class="l">Biaya tenaga kerja</div><div class="v">${rp(biaya)}</div><div class="s">pendapatan bruto + benefit perusahaan${prev ? "<br>" + delta(biaya, prev.biaya) : ""}</div></div>
      <div class="kpi"><div class="l">Gaji ditransfer</div><div class="v">${rp(thp)}</div><div class="s">total take home pay ${rk.filter((r) => r.adaTarif).length} pegawai</div></div>
      <div class="kpi"><div class="l">Total invoice</div><div class="v">${inv ? rp(inv) : "—"}</div><div class="s">${invCab.length} dari ${cab.length} lokasi diisi</div></div>
      <div class="kpi"><div class="l">${margin >= 0 ? "Margin" : "Rugi"} (lokasi ber-invoice)</div><div class="v" style="color:${!inv ? "inherit" : margin >= 0 ? "var(--accent)" : "var(--bad)"}">${inv ? rp(Math.abs(margin)) : "—"}</div><div class="s">${inv ? pct(Math.abs(margin) / inv) + " dari invoice" : "isi invoice di tabel bawah"}</div></div>
      <div class="kpi"><div class="l">Potongan terkumpul</div><div class="v">${rp(sumBy(rk, (r) => r.Potongan))}</div><div class="s">telat ${rp(sumBy(rk, (r) => r.TelatPot))} · BPJS, kasbon, dll</div></div>
    </div>`;
    h += '<div class="panel"><h2>Yang perlu diputuskan bulan ini</h2><p class="sub">Disusun otomatis dari data, urut dari yang paling penting.</p><div class="insights" style="margin-top:6px">' +
      insights(cab).map((x) => `<div class="ins"><div><span class="pill ${sev[x.sev][0]}">${sev[x.sev][1]}</span></div><div><div class="what">${esc(x.what)}</div><div class="act">${esc(x.act)}</div></div></div>`).join("") + "</div></div>";
    // biaya vs invoice
    const cabB = [...cab].sort((a, b) => b.biaya - a.biaya);
    h += `<div class="panel stack" id="inv"><div><h2>Biaya gaji vs invoice per lokasi</h2><p class="sub">Isi nilai invoice yang dikirim ke klien bulan ini. Selisih merah berarti biaya gaji lebih besar dari tagihan.</p></div>${pairBars(cabB)}
      <div class="scroll"><table><thead><tr><th>Lokasi</th><th class="n">Pegawai</th><th class="n">Gaji ditransfer</th><th class="n">Benefit perusahaan</th><th class="n">Biaya tenaga kerja</th><th class="n">Invoice (Rp)</th><th class="n">Selisih</th><th class="n">Margin</th></tr></thead><tbody>
      ${cabB.map((c, i) => { const sel = c.invoice - c.biaya; const ben = sumBy(rk.filter((r) => r.Cabang === c.cabang && r.adaTarif), (r) => r.Benefit); return `<tr><td>${esc(c.cabang)}${c.tarifKurang ? ` <span class="pill warn">${c.tarifKurang} tanpa tarif</span>` : ""}</td><td class="n">${c.n}</td><td class="n">${rp(c.gaji)}</td><td class="n">${rp(ben)}</td><td class="n"><b>${rp(c.biaya)}</b></td>
        <td class="n"><input type="number" id="inv-${i}" data-inv="${esc(c.cabang)}" value="${c.invoice || ""}" min="0" step="100000" placeholder="0" style="width:150px;text-align:right" aria-label="Invoice ${esc(c.cabang)}"></td>
        <td class="n">${c.invoice ? `<span style="color:${sel >= 0 ? "var(--accent)" : "var(--bad)"}">${sel >= 0 ? "+" : "−"}${rp(Math.abs(sel))}</span>` : "—"}</td><td class="n">${c.invoice ? (sel < 0 ? '<span class="pill bad">rugi ' : sel / c.invoice < 0.1 ? '<span class="pill warn">' : '<span class="pill ok">') + pct(sel / c.invoice) + "</span>" : "—"}</td></tr>`; }).join("")}
      <tr class="tot"><td>Total</td><td class="n">${rk.length}</td><td class="n">${rp(thp)}</td><td class="n">${rp(sumBy(rk, (r) => r.adaTarif ? r.Benefit : 0))}</td><td class="n">${rp(biaya)}</td><td class="n">${rp(inv)}</td><td class="n">${inv ? (margin >= 0 ? "+" : "−") + rp(Math.abs(margin)) : "—"}</td><td class="n">${inv ? pct(margin / inv) : "—"}</td></tr></tbody></table></div></div>`;
    // komposisi biaya

      ["Project", (r) => r.slip.pend[2].total], ["Bonus & insentif", (r) => r.slip.pend[3].total + r.slip.pend[4].items[0][1]], ["Lembur", (r) => r.slip.pend[4].items[1][1] + r.slip.pend[4].items[2][1]],
      ["Lain-lain & adjustment", (r) => r.slip.pend[4].total - r.slip.pend[4].items[0][1] - r.slip.pend[4].items[1][1] - r.slip.pend[4].items[2][1]], ["Benefit perusahaan (BPJS dll)", (r) => r.Benefit]]
      .map(([l, f]) => ({ label: l, v: sumBy(rk.filter((r) => r.adaTarif), f) })).filter((x) => x.v > 0);
    h += '<div class="cols2">';
    h += `<div class="panel"><h2>Komposisi biaya tenaga kerja</h2><p class="sub">Dari mana biaya gaji bulan ini berasal.</p>${komp.length ? hbars(komp.map((x) => Object.assign(x, { tip: `${x.label}: ${rp(x.v)} (${pct(x.v / (biaya || 1))} dari biaya)` })), rp) : '<p class="empty">Isi tarif gaji dulu.</p>'}</div>`;
    const byG = [...cab].sort((a, b) => b.biaya - a.biaya);
    h += `<div class="panel"><h2>Biaya per pegawai per lokasi</h2><p class="sub">Rata-rata biaya tenaga kerja per orang. Berguna untuk menghitung harga kontrak.</p>${hbars(byG.filter((c) => c.biaya).map((c) => ({ label: c.cabang, v: c.biaya / c.n, tip: `${c.cabang}: ${rp(c.biaya)} untuk ${c.n} pegawai` })), rp)}</div>`;
    h += "</div>";
    // tren
    if (per.length > 1) {
      h += `<div class="stack" style="gap:8px"><h2>Tren bulanan</h2><div class="scroll"><table><thead><tr><th>Bulan</th><th class="n">Pegawai</th><th class="n">Kehadiran</th><th class="n">Biaya tenaga kerja</th><th class="n">Gaji ditransfer</th><th class="n">Invoice</th><th class="n">Margin</th><th class="n">Potongan telat</th></tr></thead><tbody>${per.map((p) => { const x = cfg.riwayat[p]; return `<tr${p === hasil.periode ? ' style="font-weight:700"' : ""}><td>${bulanLabel(p)}</td><td class="n">${x.pegawai}</td><td class="n">${pct(x.terjadwal ? x.hadir / x.terjadwal : 0)}</td><td class="n">${rp(x.biaya)}</td><td class="n">${rp(x.thp)}</td><td class="n">${x.invoice ? rp(x.invoice) : "—"}</td><td class="n">${x.invoice ? pct((x.invoice - Object.values(x.cab).filter((c) => c.invoice).reduce((a, c) => a + c.biaya, 0)) / x.invoice) : "—"}</td><td class="n">${rp(x.telatPot)}</td></tr>`; }).join("")}</tbody></table></div></div>`;
    }
    // absensi
    const cabA = cab.filter((c) => !c.tanpaJadwal).sort((a, b) => a.persen - b.persen);

  // ---------- data untuk laporan & Excel ----------
  function dataTransfer() {
    return [...hasil.rekap].filter((r) => r.adaTarif && r.Pendapatan > 0).sort((a, b) => a.Cabang.localeCompare(b.Cabang) || a.Nama.localeCompare(b.Nama)).map((r, i) => {
      const P = cfg.pegawai[r.key] || {};
      return { No: i + 1, "No. Slip": r.NoSlip, Nama: r.Nama, NIP: r.NIP, Lokasi: r.Cabang, Bank: P.bank || "", "No. Rekening": P.noRek || "", "Atas Nama": P.atasNama || r.Nama, "Nominal Transfer": Math.round(r.GajiBersih || 0), Keterangan: (P.noRek ? "" : "rekening belum diisi") };
    });
  }
  function dataLogKoreksi() {
    const rows = hasil.det.filter((d) => d.adj).map((d) => ({
      Tanggal: d.Tanggal, Nama: d.Nama, NIP: d.NIP, Lokasi: d.Cabang,
      "Status Sistem": STATUS_LABEL[d.auto.status], "Status Akhir": STATUS_LABEL[d.Status],
      "Telat Sistem (mnt)": d.auto.telat, "Telat Akhir (mnt)": d["Telat (mnt)"], "Lembur Sistem (jam)": d.auto.lembur, "Lembur Akhir (jam)": d["Lembur Dibayar (jam)"],
      Alasan: d.adj.ket || ""
    }));
    return rows.length ? rows : [{ Info: "Tidak ada koreksi manual bulan ini" }];
  }
  function dataLaporan() {
    const rk = hasil.rekap, cab = perCabang().sort((a, b) => a.cabang.localeCompare(b.cabang));
    const hadir = sumBy(rk, (r) => r.Hadir), terj = sumBy(rk, (r) => r.Terjadwal);
    const biaya = sumBy(cab, (c) => c.biaya), thp = sumBy(rk, (r) => r.GajiBersih || 0), inv = sumBy(cab, (c) => c.invoice);
    const biayaInv = sumBy(cab.filter((c) => c.invoice), (c) => c.biaya);
    const ap = cfg.approval[hasil.periode];
    const kpi = [
      ["Periode", bulanLabel(hasil.periode)], ["Status", ap ? `Disetujui oleh ${ap.oleh}, ${ap.tanggal}` : "Draft (belum disetujui)"],
      ["Jumlah pegawai", rk.length], ["Biaya tenaga kerja (Rp)", Math.round(biaya)], ["Gaji ditransfer (Rp)", Math.round(thp)],
      ["Total invoice (Rp)", Math.round(inv)], ["Margin lokasi ber-invoice (Rp)", inv ? Math.round(inv - biayaInv) : ""], ["Margin (%)", inv ? Math.round((inv - biayaInv) / inv * 1000) / 10 : ""],
      ["Total potongan (Rp)", Math.round(sumBy(rk, (r) => r.Potongan))], ["Tingkat kehadiran (%)", terj ? Math.round(hadir / terj * 1000) / 10 : ""],
      ["Hari tanpa keterangan", sumBy(rk, (r) => r.Absen)], ["Telat dipotong (kali)", sumBy(rk, (r) => r.TelatKenaKali)], ["Potongan telat (Rp)", sumBy(rk, (r) => r.TelatPot)],
      ["Lembur dibayar (Rp)", Math.round(sumBy(rk, (r) => r.LemburUpah))], ["Kasus perlu dicek", hasil.review.length], ["Koreksi manual", hasil.det.filter((d) => d.adj).length]
    ];
    const keputusan = insights(perCabang()).map((x) => ({ Tingkat: { bad: "Kritis", warn: "Perhatian", info: "Info", ok: "Baik" }[x.sev], Temuan: x.what, Tindakan: x.act }));
    const biayaInvoice = cab.map((c) => ({ Lokasi: c.cabang, Pegawai: c.n, "Gaji Ditransfer": Math.round(c.gaji), "Biaya Tenaga Kerja": Math.round(c.biaya), Invoice: c.invoice || "", Selisih: c.invoice ? Math.round(c.invoice - c.biaya) : "", "Margin (%)": c.invoice ? Math.round((c.invoice - c.biaya) / c.invoice * 1000) / 10 : "", "Biaya per Pegawai": Math.round(c.biaya / Math.max(1, c.n)) }));
    const kehadiran = cab.map((c) => ({ Lokasi: c.cabang, Pegawai: c.n, Hadir: c.hadir, Terjadwal: c.terjadwal, "Kehadiran (%)": c.tanpaJadwal ? "sesuai order" : Math.round(c.persen * 1000) / 10, "Tanpa Keterangan": c.absen, "Telat (kali)": c.telat, "Potongan Telat": c.telatPot, "Upah Lembur": Math.round(c.lembur), "Lembur Belum Diputuskan (jam)": Math.round(c.lemburTak * 10) / 10 }));
    const pegawai = [...rk].sort((a, b) => a.Cabang.localeCompare(b.Cabang) || a.Nama.localeCompare(b.Nama)).map((r) => ({ "No. Slip": r.NoSlip, Nama: r.Nama, Lokasi: r.Cabang, Jabatan: r.Jabatan, Hadir: r.Hadir, Terjadwal: r.Terjadwal, "Tanpa Ket.": r.Absen, "Telat Dipotong": r.TelatKenaKali, "Pendapatan Bruto": Math.round(r.Pendapatan), Potongan: Math.round(r.Potongan), "Gaji Diterima": r.GajiBersih == null ? "" : Math.round(r.GajiBersih), "Biaya Tenaga Kerja": r.adaTarif ? Math.round(r.Biaya) : "" }));
    const komp = [["Gaji pokok", (r) => r.slip.pend[0].items[0][1]], ["Tunjangan tetap", (r) => r.slip.pend[0].total - r.slip.pend[0].items[0][1]], ["Home cleaning", (r) => r.slip.pend[1].total], ["Project", (r) => r.slip.pend[2].total], ["Bonus & insentif", (r) => r.slip.pend[3].total], ["Lain-lain, lembur & adjustment", (r) => r.slip.pend[4].total], ["Benefit perusahaan", (r) => r.Benefit]]
      .map(([l, f]) => ({ Komponen: l, "Jumlah (Rp)": Math.round(sumBy(rk.filter((r) => r.adaTarif), f)) }));
    const harian = perHari().map((d) => ({ Tanggal: d.tgl, Hari: d.hari, Hadir: d.hadir, Terjadwal: d.terjadwal, "Kehadiran (%)": Math.round(d.persen * 1000) / 10 }));
    const tren = Object.keys(cfg.riwayat).sort().map((p) => { const x = cfg.riwayat[p]; return { Bulan: bulanLabel(p), Pegawai: x.pegawai, "Kehadiran (%)": x.terjadwal ? Math.round(x.hadir / x.terjadwal * 1000) / 10 : "", "Biaya Tenaga Kerja": x.biaya, "Gaji Ditransfer": x.thp, Invoice: x.invoice || "", "Potongan Telat": x.telatPot }; });
    return { kpi, keputusan, biayaInvoice, kehadiran, pegawai, komp, harian, tren, ap, cab, rk };
  }
  async function unduhLaporanExcel() {
    try {
      const L = dataLaporan(), wb = XLSX.utils.book_new(), add = (rows, nm) => XLSX.utils.book_append_sheet(wb, Array.isArray(rows[0]) ? XLSX.utils.aoa_to_sheet(rows) : XLSX.utils.json_to_sheet(rows.length ? rows : [{ Info: "Tidak ada data" }]), nm);
      add([["Laporan Absensi & Penggajian", namaPT()], [], ...L.kpi], "Ringkasan");
      add(L.keputusan, "Perlu Diputuskan");
      add(L.biayaInvoice, "Biaya vs Invoice");
      add(L.komp, "Komposisi Biaya");
      add(L.kehadiran, "Kehadiran per Lokasi");
      add(L.harian, "Kehadiran Harian");
      add(L.pegawai, "Gaji per Pegawai");
      add(dataTransfer(), "Daftar Transfer");
      add(dataLogKoreksi(), "Log Koreksi");
      add(L.tren, "Tren Bulanan");
      await saveFile("Laporan_Gaji_" + hasil.periode + ".xlsx", XLSX.write(wb, { type: "array", bookType: "xlsx" }), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    } catch (e) { setSaved("Unduhan gagal: " + (e.message || e)); }
  }

  // ---------- laporan manajemen PDF ----------
  async function unduhLaporanPDF() {
    try {
      if (!window.jspdf) throw new Error("Pembuat PDF belum termuat. Periksa koneksi lalu muat ulang halaman.");
      const L = dataLaporan(), doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      const G = [14, 92, 61], INK = [27, 36, 48], MUTED = [93, 104, 116], SOFT = [238, 244, 241], LINE = [221, 227, 232], RED = [179, 38, 30], AMB = [154, 91, 0];
      const X0 = 14, X1 = 196, W = X1 - X0, BOTTOM = 280;

      const kepala = (first) => {

          doc.text("Dicetak " + tglPanjang(new Date()), X1, 26.5, { align: "right" });

        } else {

        }
      };
      const baru = () => { doc.addPage(); kepala(false); };
      const judul = (t, sub) => {
        if (y > BOTTOM - 20) baru();
        doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(...G); doc.text(t, X0, y);
        doc.setDrawColor(...G); doc.setLineWidth(0.4); doc.line(X0, y + 1.8, X1, y + 1.8); y += 7;
        if (sub) { doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(sub, X0, y); y += 5; }
      };
      const tabel = (cols, rows, opt) => {
        const tot = cols.reduce((a, c) => a + c.w, 0), sc = W / tot;
        const head = () => {
          doc.setFillColor(...SOFT); doc.rect(X0, y - 4, W, 6.5, "F");
          doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...MUTED);
          let x = X0; cols.forEach((c) => { const cw = c.w * sc; doc.text(c.t, c.r ? x + cw - 1.5 : x + 1.5, y, { align: c.r ? "right" : "left" }); x += cw; }); y += 6;
        };
        head();
        rows.forEach((row, ri) => {
          const isTot = opt && opt.total && ri === rows.length - 1;
          if (y > BOTTOM) { baru(); head(); }
          doc.setFont("helvetica", isTot ? "bold" : "normal"); doc.setFontSize(8.5);
          let x = X0;
          cols.forEach((c, ci) => {
            const cw = c.w * sc, v = row[ci];
            const col = typeof v === "object" && v ? v : { t: v };
            doc.setTextColor(...(col.c || INK));
            doc.text(doc.splitTextToSize(String(col.t == null ? "" : col.t), cw - 3)[0] || "", c.r ? x + cw - 1.5 : x + 1.5, y, { align: c.r ? "right" : "left" });

          y += 5.6;

      };

      kepala(true);
      // ringkasan angka
      const rk = L.rk, cab = L.cab;
      const biaya = sumBy(cab, (c) => c.biaya), inv = sumBy(cab, (c) => c.invoice), biayaInv = sumBy(cab.filter((c) => c.invoice), (c) => c.biaya), margin = inv - biayaInv;
      const hadir = sumBy(rk, (r) => r.Hadir), terj = sumBy(rk, (r) => r.Terjadwal);
      const kotak = [["Biaya tenaga kerja", rpT(biaya)], ["Gaji ditransfer", rpT(sumBy(rk, (r) => r.GajiBersih || 0))], ["Total invoice", inv ? rpT(inv) : "-"],
        [margin >= 0 ? "Margin" : "Rugi", inv ? rpT(Math.abs(margin)) + " (" + pct(Math.abs(margin) / inv) + ")" : "-", inv ? (margin >= 0 ? G : RED) : INK],
        ["Kehadiran", pct(terj ? hadir / terj : 0)], ["Telat dipotong", sumBy(rk, (r) => r.TelatKenaKali) + "x · " + rpT(sumBy(rk, (r) => r.TelatPot))]];
      const kw = W / 3;
      kotak.forEach((k, i) => {

        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(k[0], x + 4, yy + 5.5);
        doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...(k[2] || INK)); doc.text(k[1], x + 4, yy + 12);
      });
      y += 40;
      // keputusan
      judul("Yang perlu diputuskan", "Disusun otomatis dari data absensi dan penggajian.");

        doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(t2, X0 + 22, y); y += t2.length * 4 + 3;
      });
      y += 2;
      // biaya vs invoice

      tabel([{ t: "Lokasi", w: 46 }, { t: "Pegawai", w: 14, r: 1 }, { t: "Gaji ditransfer", w: 26, r: 1 }, { t: "Biaya", w: 26, r: 1 }, { t: "Invoice", w: 26, r: 1 }, { t: "Selisih", w: 26, r: 1 }, { t: "Margin", w: 16, r: 1 }],

          .concat([["Total", rk.length, rpT(sumBy(rk, (r) => r.GajiBersih || 0)), rpT(biaya), inv ? rpT(inv) : "-", inv ? (margin >= 0 ? "+" : "-") + rpT(Math.abs(margin)) : "-", inv ? pct(margin / inv) : "-"]]), { total: 1 });
      // komposisi
      judul("Komposisi biaya tenaga kerja");
      tabel([{ t: "Komponen", w: 70 }, { t: "Jumlah", w: 40, r: 1 }, { t: "Porsi", w: 25, r: 1 }], L.komp.filter((k) => k["Jumlah (Rp)"]).map((k) => [k.Komponen, rpT(k["Jumlah (Rp)"]), pct(k["Jumlah (Rp)"] / (biaya || 1))]));
      // kehadiran
      judul("Kehadiran per lokasi");
      tabel([{ t: "Lokasi", w: 46 }, { t: "Pegawai", w: 14, r: 1 }, { t: "Hadir", w: 14, r: 1 }, { t: "Terjadwal", w: 17, r: 1 }, { t: "Kehadiran", w: 18, r: 1 }, { t: "Tanpa ket.", w: 17, r: 1 }, { t: "Telat", w: 12, r: 1 }, { t: "Pot. telat", w: 22, r: 1 }],
        cab.map((c) => [c.cabang, c.n, c.hadir, c.terjadwal, c.tanpaJadwal ? "order" : { t: pct(c.persen), c: c.persen < AMBANG_HADIR ? AMB : INK }, c.absen, c.telat, rpT(c.telatPot)]));
      // per pegawai
      baru();
      judul("Rincian gaji per pegawai");
      tabel([{ t: "No. slip", w: 22 }, { t: "Nama", w: 38 }, { t: "Lokasi", w: 34 }, { t: "Hadir", w: 13, r: 1 }, { t: "Telat", w: 11, r: 1 }, { t: "Bruto", w: 23, r: 1 }, { t: "Potongan", w: 21, r: 1 }, { t: "Diterima", w: 23, r: 1 }],
