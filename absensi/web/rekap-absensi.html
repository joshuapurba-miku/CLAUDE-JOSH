<title>Rekap Absensi Gaji</title>
<style>
/* Layout: bilah data di atas, lima tab. Dashboard = ringkasan dulu, lalu keputusan, lalu grafik, lalu tabel. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #17212b;
  --ink-2: #5a6775;
  --ink-3: #7d8a97;
  --line: #d5dce3;
  --accent: #0e7a4f;
  --accent-ink: #ffffff;
  --accent-soft: #dff1e8;
  --bar: #1f8a5c;
  --bar-track: #e3e8ed;
  --warn: #9a5b00;
  --warn-soft: #fbefd5;
  --warn-bar: #d48a12;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf0; --ink-2: #9aa7b4; --ink-3: #7b8896;
    --line: #2e3a47; --accent: #4cc38a; --accent-ink: #0b1a13; --accent-soft: #17382a; --bar: #45b880; --bar-track: #26313c;
    --warn: #f0b95a; --warn-soft: #3a2c10; --warn-bar: #e0a03a; --bad: #ff8a80; --bad-soft: #3d1b19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf0; --ink-2: #9aa7b4; --ink-3: #7b8896;
  --line: #2e3a47; --accent: #4cc38a; --accent-ink: #0b1a13; --accent-soft: #17382a; --bar: #45b880; --bar-track: #26313c;
  --warn: #f0b95a; --warn-soft: #3a2c10; --warn-bar: #e0a03a; --bad: #ff8a80; --bad-soft: #3d1b19; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; text-wrap: balance; }
h3 { font-size: 14px; margin: 0; }
p { margin: 0; }
.sub { color: var(--ink-2); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.saved { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.databar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.databar .meta { min-width: 0; }
.databar b { font-size: 15px; }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 0 6px; margin-left: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .cols2 { grid-template-columns: 1fr; } }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.step { display: flex; gap: 10px; align-items: flex-start; min-width: 0; text-align: left; }
.step .no { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.step.done .no { background: var(--accent); color: var(--accent-ink); }
.step b { display: block; }
/* angka utama */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.kpi .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
/* keputusan */
.insights { display: flex; flex-direction: column; }
.ins { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ins:first-child { border-top: 0; }
.ins .what { font-weight: 600; }
.ins .act { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
@media (max-width: 520px) { .ins { grid-template-columns: 1fr; gap: 4px; } }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
/* grafik batang horizontal */
.hbars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr minmax(64px, auto); gap: 10px; align-items: center; font-size: 12.5px; }
.hbar .nm { overflow-wrap: anywhere; color: var(--ink); }
.hbar .tr { height: 14px; background: var(--bar-track); border-radius: 0 4px 4px 0; position: relative; }
.hbar .fl { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.hbar .fl.warn { background: var(--warn-bar); }
.hbar .vl { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { fill: var(--ink-2); font-size: 11px; font-family: var(--font-body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart rect.col { fill: var(--bar); }
.chart rect.col.warn { fill: var(--warn-bar); }
.chart rect.hit { fill: transparent; cursor: default; }
.chart rect.hit:hover + rect.col, .chart g.c:hover rect.col { opacity: .75; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 260px; }
/* tabel */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr.emp { cursor: pointer; }
tr.emp:hover td { background: var(--surface-2); }
tr.tot td { font-weight: 700; background: var(--surface-2); }
td.wrap { white-space: normal; min-width: 220px; }
.neg { color: var(--bad); }
.detail td { background: var(--bg); }
.detail .scroll { margin: 4px 0; }
.banner { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 20px; text-align: center; color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.filters select, .filters input { width: auto; max-width: 240px; }
td input, td select { min-width: 90px; }
textarea { resize: vertical; min-height: 70px; font-family: var(--font-num); font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
details > summary { cursor: pointer; font-weight: 600; }
/* slip gaji: kertas putih di kedua tema, seperti dokumen cetak */
.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 16px; }
@media (max-width: 420px) { .slips { grid-template-columns: 1fr; } }
.slip { --p-ink: #1b2430; --p-ink-2: #5d6874; --p-line: #d9dee4; --p-head: #0e7a4f; background: #ffffff; color: var(--p-ink); border: 1px solid var(--line); border-radius: 6px; padding: 18px; font-size: 12.5px; min-width: 0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.slip .hd { display: flex; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--p-head); padding-bottom: 8px; margin-bottom: 10px; }
.slip .co { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.slip .ttl { text-align: right; font-weight: 700; color: var(--p-head); letter-spacing: .06em; font-size: 12px; white-space: nowrap; }
.slip .ttl span { display: block; color: var(--p-ink-2); letter-spacing: 0; font-weight: 600; }
.slip .id { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-bottom: 10px; }
.slip .id dt { color: var(--p-ink-2); }
.slip .id dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.slip .att { display: flex; flex-wrap: wrap; gap: 4px 14px; background: #f2f5f3; border-radius: 4px; padding: 6px 8px; margin-bottom: 10px; color: var(--p-ink-2); }
.slip .att b { color: var(--p-ink); }
.slip .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 420px) { .slip .two { grid-template-columns: 1fr; } }
.slip h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--p-ink-2); }
.slip .ln { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.slip .ln span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.slip .sum { border-top: 1px solid var(--p-line); margin-top: 4px; padding-top: 4px; font-weight: 700; }
.slip .net { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 2px solid var(--p-head); margin-top: 12px; padding-top: 8px; font-weight: 700; }
.slip .net span:last-child { font-family: var(--font-num); font-size: 17px; color: var(--p-head); }
.slip .flag { background: #fbefd5; color: #8a5200; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; font-weight: 600; }
.slip .acts { display: flex; justify-content: flex-end; margin-top: 10px; }
.slip .acts .btn.ghost { color: var(--p-ink); border-color: var(--p-line); }
@media (max-width: 520px) { h1 { font-size: 19px; } .kpi .v { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Rekap Absensi &amp; Gaji</h1>
      <p class="sub">Upload export HRIS bulanan. Dashboard, rekap karyawan, dan slip gaji langsung jadi.</p>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </header>
  <div id="databar"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-tab="dash">Dashboard</button>
    <button role="tab" aria-selected="false" data-tab="kary">Karyawan</button>
    <button role="tab" aria-selected="false" data-tab="slip">Slip Gaji</button>
    <button role="tab" aria-selected="false" data-tab="gaji">Tarif Gaji</button>
    <button role="tab" aria-selected="false" data-tab="aturan">Aturan</button>
  </nav>
  <section id="tab-dash"></section>
  <section id="tab-kary" hidden></section>
  <section id="tab-slip" hidden></section>
  <section id="tab-gaji" hidden></section>
  <section id="tab-aturan" hidden></section>
</div>
<div id="tip" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- konfigurasi bawaan ----------
  const SEED_TARIF = [
    ["Tim Lapangan DAFI SCHOOL", "PIC"], ["Tim Lapangan DAFI SCHOOL", "CSO"],
    ["Tim Lapangan FIT INFINITY", "PIC"], ["Tim Lapangan FIT INFINITY", "CSO"],
    ["Tim Lapangan RSMH", "PIC"], ["Tim Lapangan RSMH", "CSO"],
    ["Tim Lapangan Play Padel", "CSO"],
    ["Tim Lapangan Gotong-Gotong", "PIC"], ["Tim Lapangan Gotong-Gotong", "CSO"],
    ["Tim Lapangan Cv Bintang Harapan", "MANPOWER"],
    ["Home Cleaning", "CSO"],
    ["HEAD OFFICE INTERNAL", "CS & Admin Operasional"], ["HEAD OFFICE INTERNAL", "Finance"],
    ["HEAD OFFICE INTERNAL", "HUMAN RESOURCE DEPARTMENT"], ["HEAD OFFICE INTERNAL", "Legal & Compliance"],
    ["HEAD OFFICE INTERNAL", "CONTENT CREATOR INT"]
  ];
  function defaultCfg() {
    return {
      shifts: [
        { nama: "Pagi 06-14", masuk: "06:00", pulang: "14:00", cabang: "", hari: "" },
        { nama: "Pagi 07-15", masuk: "07:00", pulang: "15:00", cabang: "", hari: "" },
        { nama: "Kantor 08:30-17:30", masuk: "08:30", pulang: "17:30", cabang: "HEAD OFFICE INTERNAL, Home Cleaning", hari: "" },
        { nama: "Lapangan 09-16", masuk: "09:00", pulang: "16:00", cabang: "", hari: "" },
        { nama: "Lapangan 09-18", masuk: "09:00", pulang: "18:00", cabang: "", hari: "" },
        { nama: "Siang 10-18", masuk: "10:00", pulang: "18:00", cabang: "", hari: "" },
        { nama: "Siang 14-22", masuk: "14:00", pulang: "22:00", cabang: "", hari: "" },
        { nama: "Sore 15-23", masuk: "15:00", pulang: "23:00", cabang: "", hari: "" },
        { nama: "Sabtu DAFI 06-11", masuk: "06:00", pulang: "11:00", cabang: "Tim Lapangan DAFI SCHOOL", hari: "Sabtu" },
        { nama: "Sabtu DAFI 10-15", masuk: "10:00", pulang: "15:00", cabang: "Tim Lapangan DAFI SCHOOL", hari: "Sabtu" }
      ],
      alias: "08:30-22:00 = Kantor 08:30-17:30\n15:00-11:00 = Sore 15-23",
      tetap: "HEAD OFFICE INTERNAL\nHome Cleaning",
      tolTelat: 0, tolPulang: 10, gantiShift: 90, reviewBiaya: 120, minKerja: 120,
      lemburMin: 60, lemburBulat: 30,
      pembagi: 26, telatAmbang: 10, telatNominal: 20000, pulangPerMenit: 0, bonusDouble: 0,
      tarif: SEED_TARIF.map(([c, p]) => ({ cabang: c, posisi: p, gaji: 0, tunj: 0, makan: 0 })),
      lembur: [],
      izin: [],
      perusahaan: "", alamat: "", ttdNama: "", ttdJabatan: "HRD"
    };
  }

  // ---------- state & penyimpanan ----------
  let cfg = defaultCfg();
  let hasil = null;       // hasil hitung terakhir
  let rawRows = null;     // baris export (disimpan agar bisa dihitung ulang)
  let fileName = "";
  let dbApi = null;
  let saveTimer = null;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rp = (n) => (n || n === 0) ? "Rp" + Math.round(n).toLocaleString("id-ID") : "—";
  const num = (n) => Math.round(n).toLocaleString("id-ID");

  function mergeCfg(saved) {
    const d = defaultCfg();
    if (!saved || typeof saved !== "object") return d;
    return Object.assign(d, saved);
  }
  function setSaved(t) { $("#saved").textContent = t; }
  function scheduleSave() {
    setSaved("Menyimpan…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const json = JSON.stringify(cfg);
      let ok = false;
      try { localStorage.setItem("rekap-absensi-cfg", json); ok = true; } catch (e) { /* abaikan */ }
      if (dbApi) {
        try { await dbApi.doc("settings/main").set({ json }); ok = true; } catch (e) { /* abaikan */ }
      }
      setSaved(ok ? "Pengaturan tersimpan" : "Pengaturan tidak bisa disimpan di tampilan ini");
    }, 500);
  }
  async function loadCfg() {
    try { const j = localStorage.getItem("rekap-absensi-cfg"); if (j) cfg = mergeCfg(JSON.parse(j)); } catch (e) { /* abaikan */ }
    try {
      dbApi = await window.claude.use("db");
      if (dbApi) {
        const snap = await dbApi.doc("settings/main").get();
        const d = snap && (snap.exists === true || (typeof snap.exists === "function" && snap.exists())) ? (typeof snap.data === "function" ? snap.data() : snap.data) : null;
        if (d && d.json) { cfg = mergeCfg(JSON.parse(d.json)); renderAll(); }
      }
    } catch (e) { dbApi = null; }
  }

  // ---------- util waktu ----------
  const BULAN = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, aug: 8, agt: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };
  function parseTgl(v) {
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    const p = String(v).trim().split(/\s+/);
    const m = BULAN[(p[1] || "").slice(0, 3).toLowerCase()];
    if (p.length < 3 || !m) return null;
    return p[2] + "-" + String(m).padStart(2, "0") + "-" + String(p[0]).padStart(2, "0");
  }
  function toTimeStr(v) {
    if (typeof v === "number" && v >= 0 && v < 1) {
      const s = Math.round(v * 86400);
      const f = (x) => String(x).padStart(2, "0");
      return f(Math.floor(s / 3600)) + ":" + f(Math.floor(s % 3600 / 60)) + ":" + f(s % 60);
    }
    return String(v == null ? "" : v).trim();
  }
  function valid(s) { s = String(s == null ? "" : s).trim(); return !(s === "" || s === "X" || s === "Off" || s === "-" || s === "undefined"); }
  function menit(s) {
    s = String(s == null ? "" : s).trim();
    if (s.length < 5 || s[2] !== ":") return null;
    return +s.slice(0, 2) * 60 + +s.slice(3, 5) + (s.length >= 8 ? +s.slice(6, 8) / 60 : 0);
  }
  const hhmm = (x) => String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(Math.floor(x % 60)).padStart(2, "0");
  const list = (s) => String(s || "").split(/[,\n]/).map((x) => x.trim()).filter(Boolean);

  // ---------- baca export ----------
  const WAJIB = ["Date", "Day", "Employee Name", "NIP", "Branch", "Post", "Schedule In", "Schedule Out", "Check In At", "Check Out At", "Attendance Code"];
  function normalisasi(json) {
    if (!json.length) throw new Error("Sheet kosong.");
    const kurang = WAJIB.filter((k) => !(k in json[0]));
    if (kurang.length) throw new Error("Kolom tidak ditemukan: " + kurang.join(", ") + ". Format export HRIS berubah?");
    return json.map((r) => ({
      iso: parseTgl(r["Date"]), hari: String(r["Day"]).trim(), nama: String(r["Employee Name"]).trim(),
      nip: String(r["NIP"] == null ? "" : r["NIP"]).trim(), cabang: String(r["Branch"]).trim(), posisi: String(r["Post"]).trim(),
      si: toTimeStr(r["Schedule In"]), so: toTimeStr(r["Schedule Out"]),
      ci: toTimeStr(r["Check In At"]), co: toTimeStr(r["Check Out At"]),
      code: String(r["Attendance Code"]).trim(), lateHris: r["Late (Minutes)"],
      brS: toTimeStr(r["Break Start"]), brF: toTimeStr(r["Break Finish"]),
      dbl: toTimeStr(r["Double Shift Check In At"]),
      pt: String(r["Company"] == null ? "" : r["Company"]).trim()
    })).filter((r) => r.iso && r.nama);
  }

  // ---------- shift ----------
  function prepShifts() {
    return cfg.shifts.filter((s) => s.nama && menit(s.masuk + ":00") != null).map((s) => ({
      nama: s.nama, masuk: menit(s.masuk), pulang: menit(s.pulang),
      cabang: list(s.cabang), hari: list(s.hari)
    }));
  }
  function aliasMap() {
    const m = {};
    String(cfg.alias || "").split("\n").forEach((l) => { const i = l.indexOf("="); if (i > 0) m[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
    return m;
  }
  function shiftTerjadwal(r, shifts, alias) {
    if (!(valid(r.si) && valid(r.so))) return null;
    const key = r.si + "-" + r.so;
    if (alias[key]) { const s = shifts.find((x) => x.nama === alias[key]); if (s) return s; }
    const a = menit(r.si), b = menit(r.so);
    if (a == null || b == null || b <= a || b - a > 720) return null;
    return { nama: "Jadwal " + key, masuk: a, pulang: b, cabang: [], hari: [] };
  }
  function biaya(sh, ci, co) {
    let c = Math.abs(ci - sh.masuk);
    if (co != null && co > ci) c += 0.5 * Math.abs(co - sh.pulang);
    return c;
  }
  function tentukanShift(r, shifts, alias, tetap) {
    const ci = menit(r.ci), co = menit(r.co);
    const jad = shiftTerjadwal(r, shifts, alias);
    if (jad && tetap.includes(r.cabang)) return { sh: jad, status: "sesuai jadwal (shift tetap)", bi: Math.abs(ci - jad.masuk) };
    const cands = shifts.filter((s) => (!s.cabang.length || s.cabang.includes(r.cabang)) && (!s.hari.length || s.hari.includes(r.hari)));
    if (jad && !cands.some((c) => c.nama === jad.nama)) cands.push(jad);
    if (!cands.length) return { sh: jad, status: "sesuai jadwal", bi: 0 };
    let best = cands[0], bb = biaya(best, ci, co);
    cands.forEach((c) => { const b = biaya(c, ci, co); if (b < bb) { best = c; bb = b; } });
    if (!jad) return { sh: best, status: "shift ditebak (jadwal HRIS tidak valid)", bi: bb };
    const bj = biaya(jad, ci, co);
    if (best.hari.length && best.nama !== jad.nama && bb < bj) return { sh: best, status: "shift khusus hari", bi: bb };
    if (bj - bb >= cfg.gantiShift && best.nama !== jad.nama) return { sh: best, status: "shift berubah (otomatis)", bi: bb };
    return { sh: jad, status: "sesuai jadwal", bi: bj };
  }
  function tarifLembur(cabang, iso, nip) {
    for (const a of cfg.lembur) {
      if (!a.mulai) continue;
      if (a.cabang !== "*" && a.cabang !== cabang) continue;
      if (a.nip && a.nip.trim() && a.nip.trim() !== nip) continue;
      const akhir = a.selesai || a.mulai;
      if (a.mulai <= iso && iso <= akhir) return +a.tarif || 0;
    }
    return null;
  }

  // ---------- hitung per hari ----------
  function hitungHari(r, shifts, alias, tetap) {
    const o = {
      Tanggal: r.iso, Hari: r.hari, Nama: r.nama, NIP: r.nip, Cabang: r.cabang, Posisi: r.posisi,
      "Jadwal HRIS": valid(r.si) ? r.si + "-" + r.so : "", "Shift Aktual": "", "Status Shift": "",
      "Check In": "", "Check Out": "", Status: r.code, "Telat (mnt)": 0, "Pulang Cepat (mnt)": 0,
      "Lembur (mnt)": 0, "Lembur Dibayar (jam)": 0, "Upah Lembur (Rp)": 0, "Potongan Telat (Rp)": 0,
      "Jam Kerja": 0, "Double Shift": "", "Telat HRIS (mnt)": 0, Catatan: [], _review: []
    };
    if (r.code !== "Present" || !valid(r.ci)) { if (r.code === "Present") o.Status = "Absent"; return o; }
    const ci = menit(r.ci), co = menit(r.co);
    o["Check In"] = r.ci; o["Check Out"] = valid(r.co) ? r.co : "";
    if (valid(r.lateHris) && !isNaN(+r.lateHris)) o["Telat HRIS (mnt)"] = +r.lateHris;
    if (r.ci.slice(6, 8) === "00") o.Catatan.push("check-in input manual");

    const t = tentukanShift(r, shifts, alias, tetap);
    const sh = t.sh;
    if (!sh) { o._review.push("jadwal dan shift tidak ditemukan, cek pengaturan shift"); return o; }
    o["Shift Aktual"] = hhmm(sh.masuk) + "-" + hhmm(sh.pulang);
    o["Status Shift"] = t.status;
    if (t.bi > cfg.reviewBiaya) o._review.push("jam absen tidak cocok dengan shift mana pun (selisih " + Math.round(t.bi) + " mnt)");

    o["Telat (mnt)"] = Math.max(0, Math.trunc(ci - sh.masuk) - cfg.tolTelat);
    if (o["Telat (mnt)"] > cfg.telatAmbang) o["Potongan Telat (Rp)"] = cfg.telatNominal;

    if (co == null || co <= ci) {
      o._review.push("check-out kosong/tidak valid (cek lupa absen pulang)");
    } else {
      let kerja = co - ci;
      const ks = menit(r.brS), kf = menit(r.brF);
      if (ks != null && kf != null && kf > ks) kerja -= kf - ks;
      o["Jam Kerja"] = Math.round(kerja / 60 * 100) / 100;
      if (kerja < cfg.minKerja) {
        o._review.push("durasi kerja hanya " + Math.round(kerja) + " mnt (check-out salah?)");
      } else {
        o["Pulang Cepat (mnt)"] = Math.max(0, Math.trunc(sh.pulang - co) - cfg.tolPulang);
        const lembur = Math.trunc(co - sh.pulang);
        o["Lembur (mnt)"] = Math.max(0, lembur);
        if (lembur >= cfg.lemburMin) {
          const tarif = tarifLembur(r.cabang, r.iso, r.nip);
          if (tarif != null) {
            const p = cfg.lemburBulat || 30;
            o["Lembur Dibayar (jam)"] = Math.floor(lembur / p) * p / 60;
            o["Upah Lembur (Rp)"] = Math.round(o["Lembur Dibayar (jam)"] * tarif);
            o.Catatan.push("lembur dibayar (aturan manual)");
          } else o.Catatan.push("lembur terdeteksi, tidak ada aturan lembur → tidak dibayar");
        }
        if (lembur >= 240) o._review.push("lembur ≥ 4 jam, pastikan jam pulang benar");
      }
    }
    if (valid(r.dbl)) { o["Double Shift"] = "ya"; o.Catatan.push("double shift (shift tambahan)"); }
    if (t.status.startsWith("shift berubah")) o.Catatan.push("shift berubah dari " + o["Jadwal HRIS"]);
    return o;
  }

  // ---------- hitung bulanan ----------
  function hitung(rows) {
    const shifts = prepShifts(), alias = aliasMap(), tetap = list(cfg.tetap);
    const det = rows.map((r) => hitungHari(r, shifts, alias, tetap));
    det.sort((a, b) => a.Nama.localeCompare(b.Nama) || a.Tanggal.localeCompare(b.Tanggal));

    const grup = new Map();
    det.forEach((d) => { const k = d.Nama + "||" + d.NIP; if (!grup.has(k)) grup.set(k, []); grup.get(k).push(d); });

    const rekap = [];
    grup.forEach((g) => {
      const f = g[0];
      const hadir = g.filter((d) => d.Status === "Present");
      const absen = g.filter((d) => d.Status === "Absent");
      const izin = cfg.izin.filter((z) => z.tanggal && ((z.nip && z.nip.trim() === f.NIP) || (z.nama && z.nama.trim().toLowerCase() === f.Nama.toLowerCase())));
      const tgIzin = new Map(izin.map((z) => [z.tanggal, z.dibayar === "ya"]));
      const absenIzin = absen.filter((d) => tgIzin.has(d.Tanggal));
      const izinBayar = absenIzin.filter((d) => tgIzin.get(d.Tanggal)).length;
      const telat = hadir.filter((d) => d["Telat (mnt)"] > 0), pc = hadir.filter((d) => d["Pulang Cepat (mnt)"] > 0);
      const sum = (arr, k) => arr.reduce((s, d) => s + (+d[k] || 0), 0);
      const t = cfg.tarif.find((x) => x.cabang === f.Cabang && x.posisi === f.Posisi);
      const r = {
        Nama: f.Nama, NIP: f.NIP, Cabang: f.Cabang, Posisi: f.Posisi,
        Terjadwal: hadir.length + absen.length, Libur: g.filter((d) => d.Status === "Off").length,
        Hadir: hadir.length, Absen: absen.length, Izin: absenIzin.length, AbsenDipotong: absen.length - izinBayar,
        TelatKali: telat.length, TelatMnt: sum(telat, "Telat (mnt)"),
        TelatPot: sum(hadir, "Potongan Telat (Rp)"), TelatKenaKali: hadir.filter((d) => d["Potongan Telat (Rp)"] > 0).length,
        PcKali: pc.length, PcMnt: sum(pc, "Pulang Cepat (mnt)"),
        LemburJam: sum(hadir, "Lembur Dibayar (jam)"), LemburUpah: sum(hadir, "Upah Lembur (Rp)"),
        LemburTakDibayarJam: hadir.filter((d) => d["Lembur Dibayar (jam)"] === 0 && d["Lembur (mnt)"] >= cfg.lemburMin).reduce((s, d) => s + d["Lembur (mnt)"], 0) / 60,
        Double: hadir.filter((d) => d["Double Shift"] === "ya").length,
        ShiftBerubah: hadir.filter((d) => d["Status Shift"].startsWith("shift berubah")).length,
        TelatHris: sum(hadir, "Telat HRIS (mnt)"),
        adaTarif: !!(t && +t.gaji > 0), gaji: t ? +t.gaji || 0 : 0, tunj: t ? +t.tunj || 0 : 0, makan: t ? +t.makan || 0 : 0,
        detail: g
      };
      r.PotAbsen = r.gaji / (cfg.pembagi || 26) * r.AbsenDipotong;
      r.PotPc = r.PcMnt * cfg.pulangPerMenit;
      r.UangMakan = r.makan * r.Hadir;
      r.BonusDouble = r.Double * cfg.bonusDouble;
      r.Pendapatan = r.gaji + r.tunj + r.UangMakan + r.LemburUpah + r.BonusDouble;
      r.Potongan = r.PotAbsen + r.TelatPot + r.PotPc;
      r.GajiBersih = r.adaTarif ? Math.max(0, r.Pendapatan - r.Potongan) : null;
      r.PersenHadir = r.Terjadwal ? r.Hadir / r.Terjadwal : 0;
      rekap.push(r);
    });

    const review = [];
    det.forEach((d) => { if (d._review.length) review.push({ Tanggal: d.Tanggal, Nama: d.Nama, NIP: d.NIP, Cabang: d.Cabang, "Jadwal HRIS": d["Jadwal HRIS"], "Check In": d["Check In"], "Check Out": d["Check Out"], Alasan: d._review.join("; ") }); });
    rekap.forEach((r) => { if (r.Terjadwal && r.Hadir === 0) review.push({ Tanggal: "", Nama: r.Nama, NIP: r.NIP, Cabang: r.Cabang, "Jadwal HRIS": "", "Check In": "", "Check Out": "", Alasan: "Tidak pernah absen sebulan penuh (" + r.Absen + " hari Absent): resign, belum pakai aplikasi, atau izin?" }); });
    const nipNama = new Map();
    rows.forEach((r) => { if (!nipNama.has(r.nip)) nipNama.set(r.nip, new Set()); nipNama.get(r.nip).add(r.nama); });
    nipNama.forEach((v, nip) => {
      if (nip && nip !== "0" && v.size > 1) review.push({ Tanggal: "", Nama: [...v].join(", "), NIP: nip, Cabang: "", "Jadwal HRIS": "", "Check In": "", "Check Out": "", Alasan: "NIP dipakai lebih dari satu orang, rapikan di HRIS" });
      if (!nip || nip === "0") v.forEach((n) => review.push({ Tanggal: "", Nama: n, NIP: nip, Cabang: "", "Jadwal HRIS": "", "Check In": "", "Check Out": "", Alasan: "NIP kosong/0, lengkapi di HRIS" }));
    });

    const tglList = det.map((d) => d.Tanggal).sort();
    return { det, rekap, review, periode: tglList[0].slice(0, 7), dari: tglList[0], sampai: tglList[tglList.length - 1] };
  }

        "<td><input type='text' data-p='shifts' data-i='" + i + "' data-f='hari' value='" + esc(s.hari) + "' placeholder='Sabtu' aria-label='Hari'></td>" +
        "<td><button class='btn ghost small' data-del='shifts' data-i='" + i + "'>Hapus</button></td></tr>";
    });
    h += '</tbody></table></div><div><button class="btn ghost" data-add="shifts">Tambah shift</button></div>' +
      '<div class="grid"><div class="field"><label for="c-alias">Jadwal HRIS yang salah setting (jadwal = nama shift)</label><textarea id="c-alias" data-cfg="alias">' + esc(cfg.alias) + '</textarea></div>' +
      '<div class="field"><label for="c-tetap">Cabang dengan shift tetap (tidak ditebak), satu per baris</label><textarea id="c-tetap" data-cfg="tetap">' + esc(cfg.tetap) + "</textarea></div></div>" +
      '<div class="grid">' + f("Ganti shift jika lebih cocok (selisih menit)", "gantiShift") + f("Tandai review jika selisih melebihi (menit)", "reviewBiaya") + f("Durasi kerja minimal valid (menit)", "minKerja") + "</div></div></details>";
    h += '<div><button class="btn ghost small" data-reset="1">Kembalikan semua pengaturan ke bawaan</button></div></div>';
    el.innerHTML = h;
    bindEdits(el);
  }

  // ---------- edit pengaturan ----------
  const NEW_ROW = {
    tarif: () => ({ cabang: "", posisi: "", gaji: 0, tunj: 0, makan: 0 }),
    lembur: () => ({ cabang: "", mulai: "", selesai: "", tarif: 0, nip: "", ket: "" }),
    izin: () => ({ nama: "", nip: "", tanggal: "", jenis: "Sakit", dibayar: "ya" }),
    shifts: () => ({ nama: "", masuk: "", pulang: "", cabang: "", hari: "" })
  };
  function afterEdit(rerenderTab) {
    scheduleSave();
    hitungUlang();
    renderData();
    if (rerenderTab) renderAll(true);
  }
  function bindEdits(root) {
    root.querySelectorAll("[data-p]").forEach((inp) => {
      inp.addEventListener("change", () => {
        const row = cfg[inp.dataset.p][+inp.dataset.i];
        let v = inp.value;
        if (inp.type === "number") v = +v || 0;
        row[inp.dataset.f] = v;
        afterEdit(false);
      });
    });
    root.querySelectorAll("[data-cfg]").forEach((inp) => {
      inp.addEventListener("change", () => {
        cfg[inp.dataset.cfg] = inp.type === "number" ? (+inp.value || 0) : inp.value;
        afterEdit(false);
      });
    });
    root.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => { cfg[b.dataset.add].push(NEW_ROW[b.dataset.add]()); afterEdit(true); }));
    root.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => { cfg[b.dataset.del].splice(+b.dataset.i, 1); afterEdit(true); }));
    root.querySelectorAll("[data-reset]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.armed) { cfg = defaultCfg(); afterEdit(true); } else { b.dataset.armed = "1"; b.textContent = "Klik lagi untuk menghapus semua pengaturan"; }
    }));
  }


  // ---------- state tampilan ----------
  let perusahaanFile = "";
  let filterCabang = "", filterCari = "", terbuka = new Set();
  let slipCabang = "", slipCari = "";
  const AMBANG_HADIR = 0.85;
  const pct = (x) => (x * 100).toFixed(1).replace(".", ",") + "%";
  const jam = (x) => (Math.round(x * 10) / 10).toLocaleString("id-ID") + " jam";
  const namaPT = () => cfg.perusahaan || perusahaanFile || "Nama perusahaan";
  const keyOf = (r) => r.Nama + "||" + r.NIP;
  const sumBy = (arr, f) => arr.reduce((s, x) => s + (+f(x) || 0), 0);

  function showTab(name) {
    document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-selected", x.dataset.tab === name ? "true" : "false"));
    ["dash", "kary", "slip", "gaji", "aturan"].forEach((t) => { $("#tab-" + t).hidden = t !== name; });
  }
  function renderData() { renderBar(); renderDash(); renderKary(); renderSlip(); updateTabCounts(); }
  function renderAll(keepTab) { renderGaji(); renderAturan(); if (!keepTab) renderData(); else updateTabCounts(); }

  function updateTabCounts() {
    const set = (tab, n) => {
      const b = $('#tabs button[data-tab="' + tab + '"]');
      const old = b.querySelector(".count"); if (old) old.remove();
      if (n) { const s = document.createElement("span"); s.className = "count"; s.textContent = n; b.appendChild(s); }
    };
    set("kary", hasil ? hasil.review.length : 0);
    set("gaji", hasil ? new Set(hasil.rekap.filter((r) => !r.adaTarif && r.Hadir > 0).map((r) => r.Cabang + r.Posisi)).size : cfg.tarif.filter((t) => !(+t.gaji > 0)).length);
  }

  // ---------- bilah data ----------
  function renderBar() {
    const el = $("#databar");
    if (!hasil) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="databar"><div class="meta"><b>${bulanLabel(hasil.periode)}</b> <span class="sub">· ${esc(namaPT())} · ${hasil.rekap.length} karyawan · ${hasil.dari} s/d ${hasil.sampai}</span><div class="hint">${esc(fileName)}</div></div>
      <div class="row"><button class="btn ghost small" id="ganti">Ganti file</button><button class="btn small" id="unduh">Unduh Excel</button></div></div>`;
    $("#ganti").onclick = () => $("#file").click();
    $("#unduh").onclick = unduhExcel;
  }

  // ---------- upload ----------
  function uploadPanel() {
    const nTarif = cfg.tarif.length, isi = cfg.tarif.filter((t) => +t.gaji > 0).length;
    return `<div class="stack"><div class="panel"><div class="steps">
      <div class="step ${isi ? "done" : ""}"><div class="no">1</div><div><b>Isi tarif gaji</b><span class="sub">${isi} dari ${nTarif} kombinasi cabang + posisi sudah diisi. <a href="#" data-go="gaji">Buka Tarif Gaji</a></span></div></div>
      <div class="step ${cfg.lembur.length ? "done" : ""}"><div class="no">2</div><div><b>Atur lembur &amp; izin</b><span class="sub">${cfg.lembur.length} aturan lembur, ${cfg.izin.length} data izin. Boleh dilewati. <a href="#" data-go="aturan">Buka Aturan</a></span></div></div>
      <div class="step"><div class="no">3</div><div><b>Upload export bulan ini</b><span class="sub">Dashboard, rekap, dan slip gaji langsung jadi.</span></div></div>
    </div></div>
    <div class="drop" id="drop"><h2>Upload export absensi dari HRIS</h2><p class="sub">File .xlsx persis seperti hasil download. Data dihitung di browser Anda dan tidak dikirim ke mana pun.</p>
      <button class="btn" id="pick">Pilih file .xlsx</button><p class="hint">atau tarik file ke kotak ini</p><div id="err"></div></div></div>`;
  }
  function bindUpload(root) {
    root.querySelectorAll("[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); showTab(a.dataset.go); });
    const drop = root.querySelector("#drop");
    if (!drop) return;
    root.querySelector("#pick").onclick = () => $("#file").click();
    ["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (ev) => { const f = ev.dataTransfer.files[0]; if (f) muat(f); });
  }
  async function muat(f) {
    try {
      if (typeof XLSX === "undefined") throw new Error("Pembaca Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.");
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true });
      rawRows = normalisasi(json);
      fileName = f.name;
      perusahaanFile = (rawRows.find((r) => r.pt) || {}).pt || "";
      tambahKombinasiBaru();
      hasil = hitung(rawRows);
      terbuka.clear(); filterCabang = filterCari = slipCabang = slipCari = "";
      renderAll();
      showTab("dash");
    } catch (e) {
      const err = $("#err");
      const msg = esc(e.message || e);
      if (err) err.innerHTML = '<div class="banner bad">' + msg + "</div>"; else setSaved(e.message || String(e));
    }
  }
  function tambahKombinasiBaru() {
    let baru = 0;
    rawRows.forEach((r) => {
      if (!cfg.tarif.some((t) => t.cabang === r.cabang && t.posisi === r.posisi)) { cfg.tarif.push({ cabang: r.cabang, posisi: r.posisi, gaji: 0, tunj: 0, makan: 0 }); baru++; }
    });
    if (baru) scheduleSave();
  }
  function hitungUlang() { if (rawRows) hasil = hitung(rawRows); }
  function kosong(teks) {
    return `<div class="panel empty"><p>${teks}</p><p style="margin-top:10px"><button class="btn" data-go="dash">Upload file di Dashboard</button></p></div>`;
  }

  // ---------- agregasi untuk dashboard ----------
  function perCabang() {
    const m = new Map();
    hasil.rekap.forEach((r) => {
      if (!m.has(r.Cabang)) m.set(r.Cabang, { cabang: r.Cabang, n: 0, hadir: 0, terjadwal: 0, absen: 0, telat: 0, telatPot: 0, lembur: 0, lemburTak: 0, gaji: 0, tarifKurang: 0, berubah: 0 });
      const c = m.get(r.Cabang);
      c.n++; c.hadir += r.Hadir; c.terjadwal += r.Terjadwal; c.absen += r.Absen; c.telat += r.TelatKali; c.telatPot += r.TelatPot;
      c.lembur += r.LemburUpah; c.lemburTak += r.LemburTakDibayarJam; c.gaji += r.GajiBersih || 0; c.berubah += r.ShiftBerubah;
      if (!r.adaTarif && r.Hadir > 0) c.tarifKurang++;
    });
    return [...m.values()].map((c) => Object.assign(c, { persen: c.terjadwal ? c.hadir / c.terjadwal : 0 }));
  }
  function perHari() {
    const m = new Map();
    hasil.det.forEach((d) => {
      if (!m.has(d.Tanggal)) m.set(d.Tanggal, { tgl: d.Tanggal, hari: d.Hari, hadir: 0, terjadwal: 0 });
      const x = m.get(d.Tanggal);
      if (d.Status === "Present") { x.hadir++; x.terjadwal++; } else if (d.Status === "Absent") x.terjadwal++;
    });
    return [...m.values()].sort((a, b) => a.tgl.localeCompare(b.tgl)).map((x) => Object.assign(x, { persen: x.terjadwal ? x.hadir / x.terjadwal : 0 }));
  }

  function insights(cab) {
    const out = [], rk = hasil.rekap;
    const nol = rk.filter((r) => r.Terjadwal && r.Hadir === 0);
    if (nol.length) {
      const g = sumBy(nol, (r) => r.gaji);
      out.push({ sev: "bad", what: `${nol.length} karyawan tidak pernah hadir sebulan penuh`,
        act: `${nol.map((r) => r.Nama).join(", ")}. Pastikan statusnya (resign, belum pakai aplikasi, atau cuti panjang). Jika sudah tidak aktif, nonaktifkan di HRIS.` + (g ? ` Gaji pokok mereka yang masih tercatat ${rp(g)} per bulan.` : "") });
    }
    const rendah = cab.filter((c) => c.terjadwal && c.persen < AMBANG_HADIR).sort((a, b) => a.persen - b.persen);
    if (rendah.length) out.push({ sev: rendah[0].persen < 0.7 ? "bad" : "warn", what: `Kehadiran di bawah ${Math.round(AMBANG_HADIR * 100)}% di ${rendah.length} cabang`,
      act: rendah.map((c) => `${c.cabang} (${pct(c.persen)}, ${c.absen} hari absen)`).join("; ") + ". Cek kecukupan personel dan apakah jadwal di HRIS sesuai kenyataan." });
    const kena = rk.filter((r) => r.TelatKenaKali > 0).sort((a, b) => b.TelatKenaKali - a.TelatKenaKali || b.TelatMnt - a.TelatMnt);
    if (kena.length) out.push({ sev: "warn", what: `Telat lebih dari ${cfg.telatAmbang} menit terjadi ${sumBy(kena, (r) => r.TelatKenaKali)} kali, potongan ${rp(sumBy(kena, (r) => r.TelatPot))}`,
      act: "Paling sering: " + kena.slice(0, 3).map((r) => `${r.Nama} (${r.TelatKenaKali}×, ${r.TelatMnt} mnt)`).join(", ") + ". Pertimbangkan teguran atau evaluasi jam shift mereka." });
    const hadir = sumBy(rk, (r) => r.Hadir), berubah = sumBy(rk, (r) => r.ShiftBerubah);
    if (hadir && berubah / hadir > 0.1) {
      const top = [...cab].sort((a, b) => b.berubah - a.berubah).slice(0, 3).filter((c) => c.berubah);
      out.push({ sev: "warn", what: `${pct(berubah / hadir)} hari kerja dijalankan di shift yang berbeda dari jadwal HRIS`,
        act: "Paling banyak di " + top.map((c) => `${c.cabang} (${c.berubah} hari)`).join(", ") + ". Perbarui jadwal di HRIS agar angka telat dari HRIS bisa dipercaya. Sistem ini sudah menyesuaikan otomatis." });
    }
    const tak = sumBy(rk, (r) => r.LemburTakDibayarJam);
    if (tak >= 1) {
      const top = [...cab].sort((a, b) => b.lemburTak - a.lemburTak).slice(0, 3).filter((c) => c.lemburTak >= 0.5);
      out.push({ sev: "info", what: `${jam(tak)} lembur terdeteksi, belum dibayar karena belum ada aturan lembur`,
        act: "Terbanyak di " + top.map((c) => `${c.cabang} (${jam(c.lemburTak)})`).join(", ") + ". Jika memang lembur yang disetujui, tambahkan aturan per cabang dan tanggal di tab Aturan." });
    }
    const tk = rk.filter((r) => !r.adaTarif && r.Hadir > 0);
    if (tk.length) out.push({ sev: "warn", what: `${tk.length} karyawan belum punya tarif gaji, slip dan total biaya belum lengkap`,
      act: "Isi di tab Tarif Gaji: " + [...new Set(tk.map((r) => r.Cabang + " / " + r.Posisi))].join("; ") + "." });
    const totGaji = sumBy(cab, (c) => c.gaji);
    if (totGaji) {
      const b = [...cab].sort((a, b) => b.gaji - a.gaji)[0];
      out.push({ sev: "info", what: `Biaya gaji terbesar: ${b.cabang}, ${rp(b.gaji)} (${pct(b.gaji / totGaji)} dari total)`, act: `Rata-rata ${rp(b.gaji / Math.max(1, b.n))} per karyawan (${b.n} orang).` });
    }
    const dq = hasil.review.filter((v) => v.Alasan.startsWith("NIP"));
    if (dq.length) out.push({ sev: "info", what: `${dq.length} masalah data NIP di HRIS`, act: dq.map((v) => `${v.Nama}: ${v.Alasan}`).join("; ") + "." });
    if (!out.length) out.push({ sev: "ok", what: "Tidak ada masalah besar bulan ini", act: "Kehadiran, keterlambatan, dan lembur dalam batas wajar." });
    return out;
  }

  // ---------- grafik ----------
  function hbars(items, fmt, opts) {
    const max = Math.max(...items.map((x) => x.v), opts && opts.max || 0) || 1;
    return '<div class="hbars">' + items.map((x) =>
      `<div class="hbar" data-tip="${esc(x.tip || "")}"><div class="nm">${esc(x.label)}</div><div class="tr"><div class="fl ${x.warn ? "warn" : ""}" style="width:${Math.max(0.5, x.v / max * 100)}%"></div></div><div class="vl">${fmt(x.v)}</div></div>`).join("") + "</div>";
  }
  function kolomHarian(hr) {
    const W = 760, H = 210, L = 38, R = 8, T = 10, B = 26, n = hr.length;
    const cw = (W - L - R) / n, bw = Math.max(3, cw - 3);
    const y = (p) => T + (1 - p) * (H - T - B);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Persentase kehadiran per hari"><g class="grid">`;
    [0, 0.25, 0.5, 0.75, 1].forEach((p) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}"></line><text x="${L - 6}" y="${y(p) + 4}" text-anchor="end">${p * 100}%</text>`; });
    s += "</g>";
    hr.forEach((d, i) => {
      const x = L + i * cw + (cw - bw) / 2, top = y(d.persen), hgt = Math.max(0, y(0) - top);
      const tip = `${d.hari} ${d.tgl.slice(8)}/${d.tgl.slice(5, 7)}: ${d.hadir} hadir dari ${d.terjadwal} terjadwal (${pct(d.persen)})`;
      s += `<g class="c" data-tip="${esc(tip)}"><rect class="hit" x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}"></rect><rect class="col ${d.persen < AMBANG_HADIR ? "warn" : ""}" x="${x}" y="${top}" width="${bw}" height="${hgt}" rx="${Math.min(3, bw / 2)}"></rect></g>`;
      if (i === 0 || (+d.tgl.slice(8)) % 5 === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${+d.tgl.slice(8)}</text>`;
    });
    return s + "</svg>";
  }
  const legenda = () => `<div class="legend"><span><i style="background:var(--bar)"></i>${Math.round(AMBANG_HADIR * 100)}% atau lebih</span><span><i style="background:var(--warn-bar)"></i>di bawah ${Math.round(AMBANG_HADIR * 100)}% (perlu perhatian)</span></div>`;

  // ---------- tab Dashboard ----------
  function renderDash() {
    const el = $("#tab-dash");
    if (!hasil) { el.innerHTML = uploadPanel(); bindUpload(el); return; }
    const rk = hasil.rekap, cab = perCabang().sort((a, b) => a.persen - b.persen), hr = perHari();
    const hadir = sumBy(rk, (r) => r.Hadir), terj = sumBy(rk, (r) => r.Terjadwal), adaTarif = rk.filter((r) => r.adaTarif).length;
    const totGaji = sumBy(rk, (r) => r.GajiBersih || 0);
    const sev = { bad: ["bad", "Kritis"], warn: ["warn", "Perhatian"], info: ["", "Info"], ok: ["ok", "Baik"] };
    let h = '<div class="stack">';
    h += `<div class="kpis">
      <div class="kpi"><div class="l">Total gaji dibayar</div><div class="v">${adaTarif ? rp(totGaji) : "—"}</div><div class="s">${adaTarif} dari ${rk.length} karyawan sudah ada tarif</div></div>
      <div class="kpi"><div class="l">Tingkat kehadiran</div><div class="v">${pct(terj ? hadir / terj : 0)}</div><div class="s">${num(hadir)} hadir · ${num(terj - hadir)} absen</div></div>
      <div class="kpi"><div class="l">Telat &gt; ${cfg.telatAmbang} menit</div><div class="v">${num(sumBy(rk, (r) => r.TelatKenaKali))}×</div><div class="s">potongan ${rp(sumBy(rk, (r) => r.TelatPot))}</div></div>
      <div class="kpi"><div class="l">Lembur dibayar</div><div class="v">${rp(sumBy(rk, (r) => r.LemburUpah))}</div><div class="s">${jam(sumBy(rk, (r) => r.LemburJam))} · ${jam(sumBy(rk, (r) => r.LemburTakDibayarJam))} belum diputuskan</div></div>
      <div class="kpi"><div class="l">Perlu dicek manual</div><div class="v">${hasil.review.length}</div><div class="s">kasus, lihat tab Karyawan</div></div>
    </div>`;
    h += '<div class="panel"><h2>Yang perlu diputuskan bulan ini</h2><p class="sub">Disusun otomatis dari data, urut dari yang paling penting.</p><div class="insights" style="margin-top:6px">' +
      insights(cab).map((x) => `<div class="ins"><div><span class="pill ${sev[x.sev][0]}">${sev[x.sev][1]}</span></div><div><div class="what">${esc(x.what)}</div><div class="act">${esc(x.act)}</div></div></div>`).join("") + "</div></div>";
    h += '<div class="cols2">';
    h += '<div class="panel"><h2>Kehadiran per cabang</h2><p class="sub">Hari hadir dibanding hari terjadwal. Terendah di atas.</p>' +
      hbars(cab.map((c) => ({ label: c.cabang, v: c.persen, warn: c.persen < AMBANG_HADIR, tip: `${c.cabang}: ${c.hadir} hadir dari ${c.terjadwal} hari terjadwal, ${c.n} karyawan` })), pct, { max: 1 }) + legenda() + "</div>";
    if (totGaji) {
      const byG = [...cab].sort((a, b) => b.gaji - a.gaji);
      h += '<div class="panel"><h2>Biaya gaji per cabang</h2><p class="sub">Gaji bersih yang dibayar (karyawan dengan tarif terisi).</p>' +
        hbars(byG.map((c) => ({ label: c.cabang, v: c.gaji, tip: `${c.cabang}: ${rp(c.gaji)} untuk ${c.n} karyawan` + (c.tarifKurang ? `, ${c.tarifKurang} belum ada tarif` : "") })), rp) + "</div>";
    } else {
      h += '<div class="panel"><h2>Biaya gaji per cabang</h2><p class="sub" style="margin-top:8px">Muncul setelah tarif gaji diisi.</p><p style="margin-top:12px"><button class="btn ghost" data-go="gaji">Isi Tarif Gaji</button></p></div>';
    }
    h += "</div>";
    h += `<div class="panel chart"><div class="row between"><div><h2>Kehadiran harian</h2><p class="sub">Persentase karyawan terjadwal yang hadir tiap tanggal. Arahkan kursor ke batang untuk detail.</p></div></div>${kolomHarian(hr)}${legenda()}
      <details style="margin-top:10px"><summary class="hint">Lihat sebagai tabel</summary><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Tanggal</th><th>Hari</th><th class="n">Hadir</th><th class="n">Terjadwal</th><th class="n">Kehadiran</th></tr></thead><tbody>${hr.map((d) => `<tr><td>${d.tgl}</td><td>${esc(d.hari)}</td><td class="n">${d.hadir}</td><td class="n">${d.terjadwal}</td><td class="n">${pct(d.persen)}</td></tr>`).join("")}</tbody></table></div></details></div>`;
    const telat = [...rk].filter((r) => r.TelatMnt > 0).sort((a, b) => b.TelatMnt - a.TelatMnt).slice(0, 8);
    const absen = [...rk].filter((r) => r.Absen > 0).sort((a, b) => b.Absen - a.Absen).slice(0, 8);
    h += '<div class="cols2">';
    h += '<div class="panel"><h2>Paling banyak telat</h2><p class="sub">Total menit telat dalam sebulan, dihitung dari shift yang benar-benar dijalankan.</p>' +

      `<tr class="tot"><td>Total</td><td class="n">${rk.length}</td><td class="n">${pct(terj ? hadir / terj : 0)}</td><td class="n">${num(terj - hadir)}</td><td class="n">${num(sumBy(rk, (r) => r.TelatKali))}×</td><td class="n">${rp(sumBy(rk, (r) => r.TelatPot))}</td><td class="n">${rp(sumBy(rk, (r) => r.LemburUpah))}</td><td class="n">${jam(sumBy(rk, (r) => r.LemburTakDibayarJam))}</td><td class="n">${rp(totGaji)}</td></tr></tbody></table></div></div>`;

  // ---------- tab Karyawan ----------

    const rk = hasil.rekap.filter((r) => (!filterCabang || r.Cabang === filterCabang) && (!filterCari || (r.Nama + " " + r.NIP).toLowerCase().includes(filterCari.toLowerCase())));

      h += `<tr class="emp" data-k="${esc(key)}" tabindex="0" aria-expanded="${open}"><td><b>${esc(r.Nama)}</b><br><span class="sub">${esc(r.NIP || "NIP kosong")}</span></td>
        <td class="wrap">${esc(r.Cabang)}<br><span class="sub">${esc(r.Posisi)}</span></td>

        <td class="n">${r.PcKali}×<br><span class="sub">${r.PcMnt} mnt</span></td>

    h += hasil.review.length ? '<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Cabang</th><th>Masuk</th><th>Pulang</th><th>Alasan</th></tr></thead><tbody>' +
      hasil.review.map((v) => `<tr><td>${esc(v.Tanggal)}</td><td>${esc(v.Nama)}</td><td>${esc(v.Cabang)}</td><td>${esc(v["Check In"])}</td><td>${esc(v["Check Out"])}</td><td class="wrap">${esc(v.Alasan)}</td></tr>`).join("") + "</tbody></table></div>" : '<p class="empty">Tidak ada.</p>';

      tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };

  function detailTabel(r) {

    });
    return h + "</tbody></table></div>";
  }

  // ---------- tab Slip Gaji ----------
  function slipRows(r) {
    const isi = (a, i) => i === 0 || a[1] > 0;
    const x = slipRowsAll(r);
    return { masuk: x.masuk.filter(isi), potong: x.potong.filter((a) => a[1] > 0).concat(x.potong.some((a) => a[1] > 0) ? [] : [["Tidak ada potongan", 0]]) };
  }
  function slipRowsAll(r) {
    return {
      masuk: [["Gaji pokok", r.gaji], ["Tunjangan tetap", r.tunj], [`Uang makan (${r.Hadir} hari)`, r.UangMakan], [`Upah lembur (${jam(r.LemburJam)})`, r.LemburUpah], [`Bonus double shift (${r.Double}×)`, r.BonusDouble]],
      potong: [[`Absen (${r.AbsenDipotong} hari)`, r.PotAbsen], [`Telat > ${cfg.telatAmbang} mnt (${r.TelatKenaKali}×)`, r.TelatPot], [`Pulang cepat (${r.PcMnt} mnt)`, r.PotPc]]
    };
  }
  function slipHTML(r) {
    const s = slipRows(r);
    const ln = (a) => `<div class="ln"><span>${esc(a[0])}</span><span>${rp(a[1])}</span></div>`;
    return `<article class="slip" aria-label="Slip gaji ${esc(r.Nama)}">
      <div class="hd"><div><div class="co">${esc(namaPT())}</div>${cfg.alamat ? `<div style="color:var(--p-ink-2)">${esc(cfg.alamat)}</div>` : ""}</div><div class="ttl">SLIP GAJI<span>${bulanLabel(hasil.periode)}</span></div></div>
      ${r.adaTarif ? "" : '<div class="flag">Tarif gaji untuk cabang + posisi ini belum diisi. Slip tidak ikut diunduh.</div>'}
      <dl class="id"><dt>Nama</dt><dd>${esc(r.Nama)}</dd><dt>NIP</dt><dd>${esc(r.NIP || "-")}</dd><dt>Cabang</dt><dd>${esc(r.Cabang)}</dd><dt>Posisi</dt><dd>${esc(r.Posisi)}</dd></dl>
      <div class="att"><span>Terjadwal <b>${r.Terjadwal}</b></span><span>Hadir <b>${r.Hadir}</b></span><span>Absen <b>${r.Absen}</b></span><span>Izin <b>${r.Izin}</b></span><span>Telat <b>${r.TelatKali}×</b></span><span>Lembur <b>${jam(r.LemburJam)}</b></span></div>
      <div class="two"><div><h4>Pendapatan</h4>${s.masuk.map(ln).join("")}<div class="ln sum"><span>Total pendapatan</span><span>${rp(r.Pendapatan)}</span></div></div>
      <div><h4>Potongan</h4>${s.potong.map(ln).join("")}<div class="ln sum"><span>Total potongan</span><span>${rp(r.Potongan)}</span></div></div></div>
      <div class="net"><span>Gaji diterima</span><span>${r.adaTarif ? rp(r.GajiBersih) : "—"}</span></div>
      ${r.adaTarif ? `<div class="acts"><button class="btn ghost small" data-pdf="${esc(keyOf(r))}">Unduh PDF</button></div>` : ""}
    </article>`;
  }
  function slipFilter() {
    return hasil.rekap.filter((r) => (!slipCabang || r.Cabang === slipCabang) && (!slipCari || (r.Nama + " " + r.NIP).toLowerCase().includes(slipCari.toLowerCase())));
  }
  function renderSlip() {
    const el = $("#tab-slip");
    if (!hasil) { el.innerHTML = kosong("Slip gaji dibuat dari data absensi. Upload export dulu."); bindUpload(el); return; }
    const list = slipFilter(), siap = list.filter((r) => r.adaTarif), belum = list.length - siap.length;
    const cabangs = [...new Set(hasil.rekap.map((r) => r.Cabang))].sort();
    let h = `<div class="stack"><div class="panel"><div class="row between"><div><h2>Slip gaji ${bulanLabel(hasil.periode)}</h2><p class="sub">${siap.length} slip siap${belum ? `, ${belum} menunggu tarif gaji` : ""}. Semua slip diunduh dalam satu PDF, satu halaman per karyawan.</p></div>
      <button class="btn" id="pdfAll" ${siap.length ? "" : "disabled"}>Unduh ${siap.length} slip (PDF)</button></div>
      <div class="filters" style="margin-top:12px"><div class="row"><select id="scab" aria-label="Filter cabang"><option value="">Semua cabang</option>${cabangs.map((c) => `<option${c === slipCabang ? " selected" : ""} value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      <input type="text" id="scari" placeholder="Cari nama / NIP" value="${esc(slipCari)}" aria-label="Cari slip"></div></div></div>`;
    if (belum) h += `<div class="banner warn">${belum} karyawan belum punya tarif gaji. <a href="#" data-go="gaji">Isi Tarif Gaji</a>, slip langsung diperbarui.</div>`;
    h += list.length ? `<div class="slips">${list.map(slipHTML).join("")}</div>` : '<p class="empty">Tidak ada karyawan yang cocok.</p>';

    bindUpload(el);
    $("#scab").onchange = (e) => { slipCabang = e.target.value; renderSlip(); };
    const cari = $("#scari");
    cari.oninput = (e) => { slipCari = e.target.value; clearTimeout(cari._t); cari._t = setTimeout(() => { renderSlip(); const n = $("#scari"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
    $("#pdfAll").onclick = () => unduhPDF(siap, "Slip_Gaji_" + hasil.periode + (slipCabang ? "_" + slipCabang.replace(/[^\w]+/g, "_") : "") + ".pdf");
    el.querySelectorAll("[data-pdf]").forEach((b) => b.onclick = () => {
      const r = hasil.rekap.find((x) => keyOf(x) === b.dataset.pdf);
      unduhPDF([r], "Slip_Gaji_" + hasil.periode + "_" + r.Nama.replace(/[^\w]+/g, "_") + ".pdf");
    });
  }

  // ---------- PDF slip ----------
  function gambarSlip(doc, r) {
    const G = [14, 122, 79], INK = [27, 36, 48], MUTED = [93, 104, 116];
    const rpTxt = (n) => "Rp" + Math.round(n || 0).toLocaleString("id-ID");
    let y = 22;
    doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(14);
    const pt = doc.splitTextToSize(namaPT(), 120); doc.text(pt, 15, y);
    doc.setFontSize(13); doc.setTextColor(...G); doc.text("SLIP GAJI", 195, y, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(bulanLabel(hasil.periode), 195, y + 6, { align: "right" });
    y += pt.length * 6;
    if (cfg.alamat) { const a = doc.splitTextToSize(cfg.alamat, 120); doc.text(a, 15, y); y += a.length * 5; }
    y = Math.max(y, 32);
    doc.setDrawColor(...G); doc.setLineWidth(0.8); doc.line(15, y, 195, y); y += 9;
    const idf = [["Nama", r.Nama, "Cabang", r.Cabang], ["NIP", r.NIP || "-", "Posisi", r.Posisi]];
    doc.setFontSize(10);
    idf.forEach((p) => {
      doc.setTextColor(...MUTED); doc.text(p[0], 15, y); doc.text(p[2], 110, y);
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold");
      doc.text(doc.splitTextToSize(String(p[1]), 65)[0], 35, y); doc.text(doc.splitTextToSize(String(p[3]), 65)[0], 130, y);
      doc.setFont("helvetica", "normal"); y += 6;
    });
    y += 2;
    doc.setFillColor(242, 245, 243); doc.rect(15, y, 180, 9, "F");
    doc.setTextColor(...MUTED);
    doc.text(`Terjadwal ${r.Terjadwal}   Hadir ${r.Hadir}   Absen ${r.Absen}   Izin ${r.Izin}   Telat ${r.TelatKali}x (${r.TelatMnt} mnt)   Lembur ${jam(r.LemburJam)}`, 18, y + 6);
    y += 17;
    const s = slipRows(r);
    const kolom = (judul, rows, total, totLabel, x) => {
      let yy = y;
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(judul.toUpperCase(), x, yy); yy += 6;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...INK);
      rows.forEach((a) => { doc.text(a[0], x, yy); doc.text(rpTxt(a[1]), x + 82, yy, { align: "right" }); yy += 6; });
      doc.setDrawColor(217, 222, 228); doc.setLineWidth(0.3); doc.line(x, yy - 3.5, x + 82, yy - 3.5);
      doc.setFont("helvetica", "bold"); doc.text(totLabel, x, yy + 1); doc.text(rpTxt(total), x + 82, yy + 1, { align: "right" });
      doc.setFont("helvetica", "normal");
      return yy + 1;
    };
    const y1 = kolom("Pendapatan", s.masuk, r.Pendapatan, "Total pendapatan", 15);
    const y2 = kolom("Potongan", s.potong, r.Potongan, "Total potongan", 113);
    y = Math.max(y1, y2) + 8;
    doc.setDrawColor(...G); doc.setLineWidth(0.8); doc.line(15, y, 195, y); y += 8;
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...INK); doc.text("Gaji diterima", 15, y);
    doc.setTextColor(...G); doc.setFontSize(15); doc.text(rpTxt(r.GajiBersih), 195, y, { align: "right" });
    y += 22;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text("Diterima oleh,", 15, y); doc.text("Mengetahui,", 130, y);
    doc.text(cfg.ttdJabatan || "", 130, y + 5);
    y += 28;
    doc.text(r.Nama, 15, y); doc.text(cfg.ttdNama || "(..............................)", 130, y);
    doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(`Dihitung otomatis dari data absensi HRIS ${hasil.dari} s/d ${hasil.sampai}.`, 15, 285);
  }
  async function unduhPDF(list, filename) {
    try {
      if (!window.jspdf) throw new Error("Pembuat PDF belum termuat. Periksa koneksi lalu muat ulang halaman.");
      const dl = await window.claude.use("downloads");
      if (!dl) throw new Error("Unduhan tidak tersedia di tampilan ini.");
      const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      list.forEach((r, i) => { if (i) doc.addPage(); gambarSlip(doc, r); });
      await dl.save({ filename, data: doc.output("arraybuffer") });
    } catch (e) {
      if (e && e.code === "declined") return;
      setSaved("Unduhan gagal: " + (e.message || e.code || e));
    }
  }

  // ---------- Excel ----------
  async function unduhExcel() {
    try {
      const dl = await window.claude.use("downloads");
      if (!dl) throw new Error("Unduhan tidak tersedia di tampilan ini.");
      const wb = XLSX.utils.book_new();
      const rekap = hasil.rekap.map((r) => ({
        Nama: r.Nama, NIP: r.NIP, Cabang: r.Cabang, Posisi: r.Posisi, "Hari Terjadwal": r.Terjadwal, Hadir: r.Hadir, Absen: r.Absen, "Izin/Sakit/Cuti": r.Izin, "Absen Dipotong": r.AbsenDipotong,
        "Telat (kali)": r.TelatKali, "Telat (mnt)": r.TelatMnt, "Telat Kena Potongan (kali)": r.TelatKenaKali, "Potongan Telat (Rp)": r.TelatPot,
        "Pulang Cepat (kali)": r.PcKali, "Pulang Cepat (mnt)": r.PcMnt, "Lembur Dibayar (jam)": r.LemburJam, "Upah Lembur (Rp)": r.LemburUpah, "Lembur Belum Diputuskan (jam)": Math.round(r.LemburTakDibayarJam * 10) / 10,
        "Double Shift": r.Double, "Shift Berubah (kali)": r.ShiftBerubah, "Telat Menurut HRIS (mnt)": r.TelatHris,
        "Gaji Pokok": r.adaTarif ? r.gaji : "", "Tunjangan Tetap": r.adaTarif ? r.tunj : "", "Uang Makan": r.adaTarif ? r.UangMakan : "",
        "Potongan Absen (Rp)": r.adaTarif ? Math.round(r.PotAbsen) : "", "Potongan Pulang Cepat (Rp)": r.PotPc, "Bonus Double Shift (Rp)": r.BonusDouble,
        "Gaji Diterima": r.GajiBersih == null ? "Tarif belum diisi" : Math.round(r.GajiBersih)
      }));
      const cab = perCabang().sort((a, b) => a.cabang.localeCompare(b.cabang)).map((c) => ({ Cabang: c.cabang, Karyawan: c.n, Hadir: c.hadir, Terjadwal: c.terjadwal, "Kehadiran (%)": Math.round(c.persen * 1000) / 10, Absen: c.absen, "Telat (kali)": c.telat, "Potongan Telat (Rp)": c.telatPot, "Upah Lembur (Rp)": c.lembur, "Total Gaji (Rp)": Math.round(c.gaji) }));
      const det = hasil.det.map((d) => { const o = Object.assign({}, d); o.Catatan = d.Catatan.concat(d._review).join("; "); delete o._review; return o; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rekap), "Rekap Penggajian");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cab), "Ringkasan Cabang");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det), "Detail Harian");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hasil.review.length ? hasil.review : [{ Info: "Tidak ada" }]), "Perlu Review");
      await dl.save({ filename: "Rekap_Absensi_" + hasil.periode + ".xlsx", data: XLSX.write(wb, { type: "array", bookType: "xlsx" }) });
    } catch (e) {
      if (e && e.code === "declined") return;
      setSaved("Unduhan gagal: " + (e.message || e.code || e));
    }
  }

  // ---------- mulai ----------
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.id = "file"; fileInput.accept = ".xlsx,.xls"; fileInput.hidden = true;
  document.body.appendChild(fileInput);
  fileInput.onchange = () => { if (fileInput.files[0]) muat(fileInput.files[0]); fileInput.value = ""; };
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  const tip = $("#tip");
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t || !t.dataset.tip) { tip.hidden = true; return; }
    tip.textContent = t.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
  });
  renderAll();
  loadCfg();
})();
</script>
